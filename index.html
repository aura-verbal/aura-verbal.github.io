<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aura</title>
<meta name="description" content="Prepara tu disertación y tu entrevista de trabajo con tu propio material: plan hasta el día D y práctica en voz alta.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f3ec">
<script>/* Tema elegido en Ajustes; se aplica antes de pintar para que no parpadee */
try { var a = JSON.parse(localStorage.getItem("aura.v1") || "{}"); if (a && a.settings && a.settings.dark) { document.documentElement.setAttribute("data-theme", "dark"); document.querySelector('meta[name="theme-color"]').setAttribute("content", "#13110f"); } } catch (e) {}</script>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aura">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna pensada para celular, con barra inferior de 4 secciones.
   Identidad: marfil y cobre, con un color por área. El modo oscuro (carbón y cobre) se activa en Ajustes. */
:root{
  /* Marfil (por defecto). El modo oscuro se elige en Ajustes, no depende del sistema. */
  --bg:#f7f3ec; --surface:#ffffff; --surface-2:#f2ece2; --line:#e4dacb;
  --fg:#1c1a17; --muted:#6b6358;
  --accent:#a84d24; --accent-ink:#ffffff; --gold-dark:#7a3211; --gold-light:#e39a72;
  --good:#23784d; --bad:#b53d33; --good-soft:rgba(35,120,77,.10); --bad-soft:rgba(181,61,51,.09); --accent-soft:rgba(168,77,36,.10);
  --area-acad:#3b4fa6; --area-lab:#17707a; --area-ven:#926100; --area-soc:#8d3a8f; --area-cot:#5f6b1f;
  --bg-glow:rgba(227,154,114,.16); --vignette:transparent; --halo-c:transparent;
  --elev:0 1px 2px rgba(60,40,20,.05), 0 8px 24px rgba(60,40,20,.06);
  --font-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --nav-h:68px; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="dark"]{
  --bg:#13110f; --surface:#1c1916; --surface-2:#25211d; --line:#37312a;
  --fg:#f3ede4; --muted:#a9a093;
  --accent:#e08a5c; --accent-ink:#1a0f08; --gold-dark:#a84d24; --gold-light:#f3b993;
  --good:#6fcf98; --bad:#f08a7c; --good-soft:rgba(111,207,152,.13); --bad-soft:rgba(240,138,124,.13); --accent-soft:rgba(224,138,92,.14);
  --area-acad:#93a4f2; --area-lab:#5cc4cc; --area-ven:#dfae4a; --area-soc:#d793d9; --area-cot:#b6c35f;
  --bg-glow:rgba(224,138,92,.10); --vignette:rgba(10,8,6,.5); --halo-c:var(--accent); --elev:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:radial-gradient(900px 520px at 85% -8%, var(--bg-glow), transparent 62%) no-repeat, var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px))}
body.onboarding .wrap{padding-block-end:calc(40px + env(safe-area-inset-bottom, 0px))}
body.onboarding .nav{display:none}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em;color:var(--fg)}
h1{font-size:clamp(2rem,6vw,2.75rem);font-weight:800;line-height:1.05}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:1.5rem;font-weight:700;line-height:1.15}
h3{font-size:1.125rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.lead{color:var(--muted);max-width:46ch;margin-top:10px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb, var(--bg) 86%, transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.35rem;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;color:var(--fg)}
.brand small{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.mark{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.95rem;color:var(--accent);border:2px solid var(--accent);box-shadow:0 0 12px color-mix(in srgb, var(--halo-c) 35%, transparent), inset 0 0 6px color-mix(in srgb, var(--halo-c) 15%, transparent)}
.pill{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--accent);border:1px solid var(--line);white-space:nowrap}

/* Bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:700;position:relative;letter-spacing:.02em}
.nav button svg{width:22px;height:22px;transition:transform .25s ease}
.nav button.on{color:var(--accent)}
.nav button.on svg{transform:translateY(-1px) scale(1.08)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 2px 2px;background:var(--accent);box-shadow:0 0 10px color-mix(in srgb, var(--halo-c) 6%, transparent)}

/* Page transitions */
.view.anim-up{animation:enterUp .34s cubic-bezier(.2,.8,.2,1) both}
.view.anim-right{animation:enterRight .34s cubic-bezier(.2,.8,.2,1) both}
.view.anim-left{animation:enterLeft .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes enterUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes enterRight{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes enterLeft{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.section{padding-top:20px;display:flex;flex-direction:column;gap:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,var(--gold-light) -40%,var(--accent) 55%,var(--gold-dark) 160%);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 50%, var(--line))}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;align-self:flex-start}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* Hero photo */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:12px}
.photo{position:relative;margin:0;border-radius:18px;overflow:hidden;aspect-ratio:3/2;max-width:100%;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.photo.sm{aspect-ratio:16/9}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;animation:settle 1.6s cubic-bezier(.2,.8,.2,1) both}
.photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 50%,var(--bg) 100%),radial-gradient(ellipse at 50% 40%,transparent 60%,var(--vignette) 100%)}
@keyframes settle{from{transform:scale(1.06);opacity:.6}to{transform:none;opacity:1}}
.hero h1.over{margin-top:-52px;position:relative;z-index:1;padding:0 4px}
:root:not([data-theme="dark"]) .hero h1.over{margin-top:10px}
.hero .lead{padding:0 4px}

/* Cards */
.greet{display:flex;align-items:center;gap:14px;padding-top:22px}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--accent);border:2px solid var(--accent);background:var(--surface);box-shadow:0 0 18px color-mix(in srgb, var(--halo-c) 25%, transparent)}
.avatar.sm{width:42px;height:42px;font-size:1rem;box-shadow:none}
.card{background:var(--surface);box-shadow:var(--elev);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
button.card:hover{border-color:var(--accent)}
.card.feature{border-color:color-mix(in srgb, var(--accent) 45%, var(--line));background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 9%, var(--surface)), var(--surface) 60%)}
.card .meta{font-size:.88rem;color:var(--muted)}
.card-head{display:flex;align-items:center;gap:12px;min-width:0}
.s-icon{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb, var(--accent) 30%, transparent)}
.s-icon svg{width:22px;height:22px}
.cta{color:var(--accent);font-weight:700;font-size:.92rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);align-self:flex-start}
.tag.quiet{background:var(--surface-2);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold-dark),var(--accent),var(--gold-light));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.barlabel{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));background:var(--accent-soft);font-size:.92rem}
.banner .flag{font-size:1.5rem;line-height:1}
.banner p{flex:1;min-width:0}
.banner .x{background:none;border:0;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px;min-width:0;border:1px solid var(--line)}
.kpi b{font-family:var(--font-mono);font-size:1.2rem;display:block;color:var(--fg);font-variant-numeric:tabular-nums}
.kpi span{font-size:.76rem;color:var(--muted)}
.kpi .delta{font-size:.78rem}

/* Ring */
.ring{--p:0;--size:120px;width:var(--size);height:var(--size);border-radius:50%;position:relative;display:grid;place-items:center;flex:none;
  background:conic-gradient(from 210deg, var(--gold-dark) 0, var(--accent) calc(var(--p)*.5%), var(--gold-light) calc(var(--p)*1%), var(--surface-2) calc(var(--p)*1%));}
.ring::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--halo-c) 28%, transparent) 0, transparent 70%);opacity:calc(.25 + var(--p)/140);z-index:-1}
.ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;z-index:1;text-align:center;line-height:1.1}
.ring b{font-family:var(--font-display);font-size:1.8rem;font-weight:800;display:block}
.ring small{font-size:.7rem;color:var(--muted)}
.ring-row{display:flex;align-items:center;gap:20px;padding-top:22px}

/* Countries */
.paises{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.paises{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pais{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:54px;min-width:0}
.pais:hover{border-color:var(--muted)}
.pais .flag{font-size:1.45rem;line-height:1;flex:none}
.pais .pn{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.pais .pn b{font-size:.92rem}
.pais .pn small{font-size:.72rem;color:var(--muted)}
.pais.on{border-color:var(--accent);background:var(--accent-soft)}

/* Library */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:700;color:var(--muted)}
.fchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.soon{display:flex;flex-direction:column;gap:6px}
.soon-row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:.9rem}
.soon-row span:last-child{font-size:.75rem;white-space:nowrap}

/* Ficha */
.ficha{display:grid;gap:14px;margin:0}
.ficha dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
.ficha dd{margin:3px 0 0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:700;color:var(--muted);min-height:42px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* Stepper */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;min-width:0}
.step .n{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
.step b{display:block;font-size:.95rem}
.step.on{border-color:var(--accent);background:var(--accent-soft)}

/* Vocab */
.vocab{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vrow .from{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--bad) 60%, transparent)}
.vrow .to{font-weight:700}
.vrow .alt{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.arrow{color:var(--accent);font-family:var(--font-mono)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.vhead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto;gap:10px;padding:0 14px}
@media (max-width:480px){.vrow,.vhead{grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr)}.vrow .dots,.vhead .dh{display:none}}
.crit{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.92rem}

/* Question / chat */
.panel{background:var(--surface);box-shadow:var(--elev);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);min-height:44px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--good-soft);border-left:3px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:3px solid var(--bad)}
.fb.mid{background:var(--accent-soft);border-left:3px solid var(--accent)}
.blank{display:inline-block;min-width:4ch;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;color:var(--fg)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
textarea{width:100%;min-height:110px;resize:vertical;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hint{font-size:.88rem;color:var(--muted)}
.hint b{color:var(--fg)}
.note{font-size:.85rem;color:var(--muted)}
.dotsprog{display:flex;gap:6px}
.dotsprog i{flex:1;height:4px;border-radius:99px;background:var(--surface-2)}
.dotsprog i.done{background:var(--accent)}

/* Simulation */
.sim-head{display:flex;align-items:center;gap:12px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 59px);z-index:4;background:var(--bg);padding-block:10px;margin-block:-10px}
.meter{flex:1;min-width:0}
.meter-top{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.meter-top b{color:var(--fg)}
.meter-bar{position:relative;height:10px;border-radius:99px;background:var(--surface-2);margin-top:6px;border:1px solid var(--line)}
.meter-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--gold-dark),var(--accent),var(--gold-light));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.meter-bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted);opacity:.5}
.chat{display:flex;flex-direction:column;gap:10px}
#turnoActual{scroll-margin-top:140px}
.msg{max-width:88%;padding:10px 14px;font-size:.95rem;min-width:0}
.msg.them{align-self:flex-start;background:var(--surface-2);border-radius:4px 14px 14px 14px}
.msg.me{align-self:flex-end;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:14px 4px 14px 14px}
.msg .who{font-size:.74rem;color:var(--muted);font-weight:700;margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.say-row{display:flex;gap:10px;align-items:flex-start}
.say-row .msg{flex:1;max-width:none}
.dchip{font-family:var(--font-mono);font-size:.76rem;font-weight:500;padding:1px 7px;border-radius:99px;white-space:nowrap}
.dchip.up{color:var(--good);background:var(--good-soft)}
.dchip.down{color:var(--bad);background:var(--bad-soft)}
.dchip.flat{color:var(--muted);background:var(--surface-2)}
.escuchate{border:1px dashed color-mix(in srgb, var(--accent) 40%, var(--line));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.escuchate audio{width:100%;height:40px}
.rec-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* Results */
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-family:var(--font-display);font-size:3.5rem;font-weight:800;line-height:1}
.ending{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 0}
.medal{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--accent);box-shadow:0 0 28px color-mix(in srgb, var(--halo-c) 35%, transparent), inset 0 0 12px color-mix(in srgb, var(--halo-c) 2%, transparent);font-family:var(--font-display);font-weight:700;font-size:1.9rem;color:var(--accent)}
.ending.medio .medal{border-color:var(--gold-dark);color:var(--gold-dark);box-shadow:none}
.ending.bajo .medal{border-color:var(--line);color:var(--muted);box-shadow:none}
.turn{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.turn:first-of-type{border-top:0;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip.no{border-color:var(--bad);color:var(--bad)}
.delta{font-family:var(--font-mono);color:var(--good);font-size:.9rem}
.delta.neg{color:var(--bad)}
.recs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:12px;background:var(--bad-soft)}
.share-img{width:100%;max-width:240px;border-radius:14px;border:1px solid var(--line);align-self:center;display:block}

/* Baseline test */
.rec-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.rec-btn{--p:0;width:132px;height:132px;border-radius:50%;border:0;position:relative;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-2) 0)}
.rec-btn::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.rec-btn span{position:relative;z-index:1;display:grid;place-items:center;gap:2px;color:var(--accent)}
.rec-btn span svg{width:34px;height:34px}
.rec-btn span b{font-family:var(--font-mono);font-size:1.6rem;color:var(--fg)}
.rec-btn.live::after{background:color-mix(in srgb, var(--bad) 14%, var(--surface))}
.transcript{min-height:72px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.95rem;color:var(--fg)}
.transcript:empty::before{content:"Aquí aparecerá lo que digas...";color:var(--muted)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:.85rem;font-weight:700;color:var(--fg)}
input[type="text"],input[type="date"]{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
input[type="text"]:focus,input[type="date"]:focus{border-color:var(--accent);outline:none}
input[type="range"]{width:100%;accent-color:var(--accent)}
.chips-opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:400px){.chips-opt{grid-template-columns:1fr}}
.note a,.section a:not(.btn){color:var(--accent)}
.pais-sel{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;font-size:1rem}
.pais-sel:focus{outline:2px solid var(--accent);outline-offset:1px}
.goal-opts{display:flex;flex-direction:column;gap:8px}
.goal-opt{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.goal-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.goal-opt small{color:var(--muted);font-size:.85rem}
.goal-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.goal-opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.bk-ok{flex-direction:column;align-items:stretch}
.chip-opt{position:relative}
.chip-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip-opt span{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:.9rem;min-height:44px}
.chip-opt svg{width:18px;height:18px;flex:none}
.chip-opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.chip-opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.conf-out{font-size:.85rem;color:var(--accent);font-weight:700}
.err{color:var(--bad);font-size:.85rem;min-height:1em}
.toast{padding:10px 14px;border-radius:12px;background:var(--good-soft);border-left:3px solid var(--good);font-size:.92rem}

/* Settings */
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting p{font-size:.95rem}
.setting small{display:block;color:var(--muted);font-size:.8rem}
.switch{width:50px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);position:relative;flex:none;padding:0;transition:background .2s}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .22s cubic-bezier(.2,.8,.2,1), background .2s}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] .knob{transform:translateX(20px);background:var(--accent)}
.switch[disabled]{opacity:.4;cursor:not-allowed}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--font-mono);font-size:10px}
.chart .val{fill:var(--fg);font-family:var(--font-mono);font-size:11px}
.chart .b{fill:var(--accent)}
.chart .b:hover{fill:var(--gold-light)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.92rem;text-align:center}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.srow .s-icon{width:36px;height:36px}
.loading{display:grid;place-items:center;padding:80px 0;color:var(--muted)}
.loading .mark{width:52px;height:52px;font-size:1.4rem;animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* reto diario */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wd i{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:.85rem;font-weight:700;color:var(--accent-ink)}
.wd.on i{background:var(--accent);border-color:var(--accent)}
.wd.prac i{color:var(--accent);font-size:1.2rem;border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.wd.today i{outline:2px solid var(--accent);outline-offset:2px}
.wd small{font-size:.72rem;color:var(--muted)}
.wd.today small{color:var(--accent);font-weight:700}
.card.reto.done{border-color:color-mix(in srgb, var(--good) 35%, var(--line))}
.card.reto.done:hover{border-color:color-mix(in srgb, var(--good) 35%, var(--line))}
.card.reto.done .s-icon{color:var(--good)}
.prep-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.chips-opt.compact{grid-template-columns:repeat(4,minmax(0,1fr))}
.chips-opt.compact span{justify-content:center;padding:10px 6px}
.prep-sum .eyebrow{flex-basis:100%}
.prep-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.panel.prep{border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
.card.evento{border-color:color-mix(in srgb, var(--accent) 55%, var(--line))}
/* Prepara tu escenario: asistente conversacional */
.pw{gap:12px}
.pw-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pw-dots{display:flex;gap:5px;margin-top:8px}
.pw-dots i{width:22px;height:4px;border-radius:2px;background:var(--line);transition:background .4s,width .4s}
.pw-dots i.on{background:var(--accent)}
.pw-dots i.cur{background:color-mix(in srgb, var(--accent) 45%, var(--line));width:34px}
.pw-msg{display:flex;gap:10px;align-items:flex-end;max-width:100%}
.pw-av{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-size:.78rem;color:var(--accent);background:var(--bg)}
.bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:.96rem;max-width:calc(100% - 40px);min-width:0}
.pw-sub{display:block;margin-top:6px;font-size:.82rem;color:var(--muted)}
.pw-msg.eco .bubble{border-color:color-mix(in srgb, var(--accent) 45%, var(--line));background:var(--accent-soft)}
.pw-msg.eco .count{color:var(--accent);font-family:var(--font-mono)}
.pw-me{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:85%}
.pw-me small{color:var(--muted);font-size:.74rem;text-align:right}
.pw-me button{border:0;background:linear-gradient(135deg, var(--gold-light), var(--accent) 60%, var(--gold-dark));color:var(--accent-ink);border-radius:16px 16px 4px 16px;padding:8px 14px;font-weight:700;font-size:.92rem;text-align:right}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pwBlink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.pw-opts{display:flex;flex-wrap:wrap;gap:8px;padding-left:40px}
.pw-opts.flat{padding-left:0}
.pw-opt{padding:10px 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:.92rem;min-height:44px;transition:border-color .2s,background .2s,transform .15s}
.pw-opt.sm{font-weight:500;font-size:.84rem;min-height:38px;padding:8px 12px;color:var(--muted)}
.pw-opt:hover{border-color:var(--accent)}
.pw-opt:active,.pw-foco:active{transform:scale(.96)}
.pw-opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.pw-focos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-left:40px}
.pw-foco{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);text-align:left;font-weight:700;font-size:.86rem;min-height:92px;transition:border-color .2s,background .2s,transform .15s}
.pw-foco svg{width:24px;height:24px;color:var(--accent)}
.pw-foco:hover{border-color:var(--accent)}
.pw-foco.on{border-color:var(--accent);background:var(--accent-soft)}
.pw-input{padding-left:40px;display:flex;flex-direction:column;gap:10px}
.pw-prev{font-size:.86rem;color:var(--muted)}
.pw-prev b{color:var(--accent);font-weight:700}
.pw-final{display:flex;flex-direction:column;gap:12px}
.pw-tags{display:flex;flex-wrap:wrap;gap:6px;padding-left:40px}
.pw-tags .tag{font-size:.8rem;padding:5px 11px}
.a.pw-msg,.a.pw-me,.pw-msg.a{animation:pwIn .38s cubic-bezier(.2,.8,.3,1) both}
.a .pw-opt,.a .pw-foco,.a.pw-input{animation:pwPop .4s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
.pw-final.a .pw-av{animation:pwRing 1.2s ease-out .1s both}
.pw-final.a .tag{animation:pwPop .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i) * 110ms + 250ms)}
@keyframes pwIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pwPop{from{opacity:0;transform:translateY(6px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pwBlink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes pwRing{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent)}100%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion: reduce){.a.pw-msg,.a.pw-me,.pw-msg.a,.a .pw-opt,.a .pw-foco,.a.pw-input,.pw-final.a .tag,.pw-final.a .pw-av,.typing i{animation:none}}
/* Color por área */
.ar-acad{--ac:var(--area-acad)} .ar-lab{--ac:var(--area-lab)} .ar-ven{--ac:var(--area-ven)} .ar-soc{--ac:var(--area-soc)} .ar-cot{--ac:var(--area-cot)}
[class*="ar-"] .s-icon,.s-icon[class*="ar-"]{color:var(--ac);background:color-mix(in srgb, var(--ac) 12%, var(--surface));border-color:color-mix(in srgb, var(--ac) 32%, var(--surface))}
[class*="ar-"] .bar i{background:linear-gradient(90deg, color-mix(in srgb, var(--ac) 45%, var(--surface)), var(--ac))}
[class*="ar-"] .eyebrow.ar,.ar-txt[class*="ar-"]{color:var(--ac)}
.card[class*="ar-"]{border-left:3px solid var(--ac)}
.card[class*="ar-"]:hover{border-color:var(--ac);border-left-color:var(--ac)}
.fchip.on[class*="ar-"]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
/* Escena de apertura */
.esc{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--elev);background:#1c1a17;border:1px solid var(--line)}
.esc-stage{position:relative;aspect-ratio:3/2;overflow:hidden}
.esc-f{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.esc-f img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 45%}
.esc.idle .esc-f:first-child,.esc-f.on{opacity:1}
.esc-f.kb img{animation:var(--kb) var(--d) linear both}
.mov-in{--kb:kbIn}.mov-out{--kb:kbOut}.mov-left{--kb:kbLeft}.mov-right{--kb:kbRight}
@keyframes kbIn{from{transform:scale(1.02)}to{transform:scale(1.15)}}
@keyframes kbOut{from{transform:scale(1.16)}to{transform:scale(1.03)}}
@keyframes kbLeft{from{transform:scale(1.12) translateX(3%)}to{transform:scale(1.12) translateX(-3%)}}
@keyframes kbRight{from{transform:scale(1.12) translateX(-3%)}to{transform:scale(1.12) translateX(3%)}}
.esc-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.38) 0,transparent 24%,transparent 46%,rgba(0,0,0,.72) 100%)}
.esc.idle .esc-shade{background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55) 100%)}
.esc-segs{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.esc.idle .esc-segs{display:none}
.esc-segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.32);overflow:hidden;position:relative}
.esc-segs i::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
.esc-segs i.done::after{transform:scaleX(1)}
.esc-segs i.cur::after{animation:segFill var(--d) linear forwards}
@keyframes segFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.esc-sub{position:absolute;left:16px;right:16px;bottom:14px;margin:0;color:#fff;font-size:1.05rem;line-height:1.4;font-weight:700;text-shadow:0 1px 10px rgba(0,0,0,.55);z-index:3;text-wrap:balance}
.esc-sub.in{animation:subIn .6s ease both}
@keyframes subIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.esc-tap{position:absolute;top:0;bottom:0;width:38%;z-index:2;background:transparent;border:0;padding:0}
.esc-tap.prev{left:0}.esc-tap.next{right:0;width:62%}
.esc-tools{position:absolute;top:22px;right:10px;display:flex;gap:8px;z-index:4}
.esc-ic,.esc-skip{background:rgba(20,16,12,.45);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:99px;min-height:36px;padding:6px 12px;font-weight:700;font-size:.82rem;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.esc-ic{width:36px;padding:0;display:grid;place-items:center}
.esc-ic svg{width:18px;height:18px}
.esc-cover{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;gap:12px;padding:16px;background:transparent;border:0;color:#fff;text-align:left;width:100%}
.esc-cover b{display:block;font-family:var(--font-display);font-size:1.25rem;line-height:1.2}
.esc-cover small{font-size:.85rem;opacity:.88}
.esc-playbtn{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .2s}
.esc-cover:hover .esc-playbtn{transform:scale(1.06)}
.esc-playbtn svg{width:22px;height:22px;margin-left:3px}
.esc-cover.end{align-items:center;justify-content:center;background:rgba(15,12,10,.55)}
.esc-cover .btn:not(.primary){color:var(--fg)}
@media (prefers-reduced-motion: reduce){.esc-f.kb img,.esc-segs i.cur::after,.esc-sub.in{animation:none}.esc-segs i.cur::after{transform:scaleX(1)}}
/* Mi presentación */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.card.pres-hero{border-color:color-mix(in srgb, var(--accent) 50%, var(--line));background:linear-gradient(155deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), var(--surface) 62%)}
.card.pres-hero h3{font-size:1.25rem}
.load-opt{cursor:pointer}
.pro-card{padding:14px 16px;border-radius:var(--r);border:1px dashed color-mix(in srgb, var(--accent) 45%, var(--line));background:var(--accent-soft);display:flex;flex-direction:column;gap:6px}
.pro-card p{margin:0;font-size:.92rem}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn.sm svg{width:16px;height:16px}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;font-weight:700}
.icon-btn:disabled{opacity:.35}
.note.warn{color:var(--bad)}
.pb{gap:10px}
.pb.apertura,.pb.cierre{border-left:3px solid var(--accent)}
.pb-top{display:flex;align-items:center;gap:8px}
.pb-tools{margin-left:auto;display:flex;gap:6px}
.pb-tit{font-family:var(--font-display);font-weight:700;font-size:1.08rem}
.pb textarea{min-height:76px}
.pb-apoyo summary{cursor:pointer;font-size:.85rem;color:var(--muted);font-weight:700}
.pb-apoyo p{margin:6px 0 0;font-size:.9rem;color:var(--muted);padding-left:10px;border-left:2px solid var(--line)}
.pb-keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kchip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--fg);font-size:.85rem;font-weight:700;border:1px solid color-mix(in srgb, var(--accent) 30%, transparent)}
.kchip button{background:none;border:0;padding:0 2px;color:var(--muted);font-size:1rem;line-height:1}
input.pb-key{width:110px;min-height:34px;padding:6px 10px;border-radius:99px;font-size:.85rem}
.pday{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--elev)}
.pday.today{border-color:var(--accent);background:linear-gradient(160deg, var(--accent-soft), var(--surface) 70%)}
.pday-h{margin:0;font-size:.92rem;text-transform:capitalize}
.pday-h b{text-transform:none}
.pses{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left;width:100%}
.pses .s-icon{width:36px;height:36px}
.pses.ok{opacity:.75}
.pses.ok .s-icon{color:var(--good);background:var(--good-soft);border-color:transparent}
.pses-t{display:flex;flex-direction:column;flex:1;min-width:0}
.pses-t small{color:var(--muted);font-size:.8rem}
.pses .arrow{color:var(--muted);font-size:1.3rem}
.read-b{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.read-b p{margin:0;font-size:1.05rem;line-height:1.6}
.read-b .eyebrow{font-size:.7rem}
.fd-wrap{cursor:default}
.fd{font-size:1.12rem;line-height:1.75;margin:0}
.fd-k{color:var(--accent)}
.fd-h,.fd-i i{color:color-mix(in srgb, var(--muted) 55%, transparent);letter-spacing:1px;cursor:pointer}
.fd-i i{font-style:normal}
.fd-h.peek,.fd-i.peek i{letter-spacing:0;color:var(--fg)}
.fd-h.peek{font-size:0}
.fd-h.peek::after,.fd-i.peek::after{content:attr(data-w);font-size:1.12rem;color:var(--fg);background:var(--accent-soft);border-radius:4px}
.fd-i.peek{font-size:0}
.rev{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface-2)}
.rev .eyebrow{margin:0 0 6px}
.rev-t{font-size:1rem;line-height:1.7}
mark.miss{background:color-mix(in srgb, var(--bad) 14%, transparent);color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:3px;border-radius:3px;padding:0 1px}
.miss-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.miss-chip{font:inherit;font-size:.9rem;min-height:38px;padding:6px 12px;border-radius:99px;border:1px solid color-mix(in srgb, var(--bad) 45%, var(--line));background:var(--surface);color:var(--fg);cursor:pointer}
.miss-chip.on{border-color:var(--good);color:var(--good);background:color-mix(in srgb, var(--good) 10%, var(--surface))}
.good-note{color:var(--good);margin:6px 0 0}
.heard{margin-top:10px}
.heard summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.heard .transcript{margin-top:8px;min-height:0}
.sil-tog{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font:inherit;font-size:.88rem;min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.sil-tog svg{width:16px;height:16px;flex:none}
.sil-tog.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sil-panel{padding-top:6px;padding-bottom:6px}
.hz{line-height:2.3}
.hz-in{font:inherit;font-size:1rem;max-width:100%;padding:2px 6px;margin:0 1px;border:0;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;background:var(--accent-soft);color:var(--fg);text-align:center}
.hz-in:focus{outline:2px solid var(--accent);outline-offset:1px}
.hz-r{padding:1px 5px;border-radius:5px;font-weight:600}
.hz-r.ok,.hz-r.equiv{color:var(--good);background:color-mix(in srgb, var(--good) 12%, transparent)}
.hz-r.equiv{text-decoration:underline dotted}
.hz-r.no{color:var(--bad);background:color-mix(in srgb, var(--bad) 12%, transparent)}
.hz-r.no s{opacity:.7;font-weight:400}
.esc-ta{width:100%;margin-top:12px;font:inherit;font-size:1rem;line-height:1.55;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);resize:vertical;box-sizing:border-box}
.esc-ta:focus{outline:2px solid var(--accent);outline-offset:1px}
.bnav{display:flex;align-items:center;gap:8px}
.bnav-dots{flex:1;display:flex;gap:4px}
.bnav-dot{flex:1;min-width:0;height:28px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center}
.bnav-dot i{display:block;width:100%;height:5px;border-radius:99px;background:var(--surface-2);transition:height .15s}
.bnav-dot.done i{background:color-mix(in srgb, var(--accent) 55%, var(--surface-2))}
.bnav-dot.cur i{background:var(--accent);height:8px}
.bnav-dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.bnav-arr,.lnav-arr{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.3rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
.bnav-arr:disabled,.lnav-arr:disabled{opacity:.35;cursor:default}
.lnav{display:flex;align-items:center;gap:8px}
.lnav-arr{width:30px;height:30px;font-size:1.1rem}
/* ---------- Dos pilares (rediseño 23-oct-2026) ---------- */
.top-set{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.top-set svg{width:20px;height:20px}
.top-set.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.home{gap:16px}
.home-q{font-size:clamp(1.8rem,7vw,2.3rem);line-height:1.12}
.card.pilar{border-left:1px solid var(--line);border-top:5px solid var(--ac);border-radius:18px;padding:20px;gap:12px;cursor:pointer}
.card.pilar:hover{border-left-color:var(--line)}
.card.pilar.con-img{overflow:hidden;padding-top:0}
.pilar-img{display:block;margin:0 -20px 4px;width:calc(100% + 40px);aspect-ratio:3/1;overflow:hidden;background:var(--surface-2)}
.pilar-img img,.hub-img img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block}
.hub-img{display:block;position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/1;background:var(--surface-2);border-top:4px solid var(--ac)}
.hub-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,color-mix(in srgb, var(--bg) 35%, transparent))}
@media (prefers-reduced-motion:no-preference){.card.pilar.con-img .pilar-img img{transition:transform .4s ease}.card.pilar.con-img:hover .pilar-img img{transform:scale(1.03)}}
.card.pilar h3{font-size:1.3rem}
.card.pilar .meta{font-size:.95rem;line-height:1.5}
.s-icon.big{width:48px;height:48px;border-radius:14px}
.s-icon.big svg{width:26px;height:26px}
.pill-cta{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:99px;border:1.5px solid var(--ac);color:var(--ac);font-weight:700;font-size:.95rem}
.pill-cta svg{width:16px;height:16px}
.pill-cta.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.how3{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;font-size:.82rem;color:var(--muted)}
.how3 li{display:flex;flex-direction:column;align-items:center;gap:6px}
.how3 span{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--accent);display:grid;place-items:center;font-weight:700}
.card.home-plan{border-left:1px solid color-mix(in srgb, var(--accent) 50%, var(--line));border-top:5px solid var(--ac);border-radius:18px;padding:20px;gap:12px;cursor:pointer}
.card.home-plan h2{font-size:1.45rem;line-height:1.15;margin:2px 0}
.hp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.count-ring{flex:none;width:72px;height:72px;border-radius:50%;border:3px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.count-ring b{font-family:var(--font-display);font-size:1.6rem;color:var(--accent)}
.count-ring small{font-size:.7rem;color:var(--muted);margin-top:2px}
.hp-go{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;background:linear-gradient(180deg,var(--gold-light) -40%,var(--accent) 55%,var(--gold-dark) 160%);color:var(--accent-ink);font-weight:700;text-align:center;padding:0 12px}
.hp-go svg{width:18px;height:18px;flex:none}
.hoy-row,.tool-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--fg);font:inherit;text-align:left;width:100%}
.hoy-row.cur{border:1.5px solid var(--accent)}
.hoy-row.ok .hoy-t{color:var(--muted);text-decoration:line-through}
.hoy-ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--good)}
.hoy-row.cur .hoy-ck{border-color:var(--accent)}
.hoy-row.ok .hoy-ck{border:0}
.hoy-ck svg{width:24px;height:24px}
.hoy-t{flex-grow:1;font-weight:700;font-size:.95rem}
.link-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px dashed var(--ac);background:none;color:var(--fg);font:inherit;text-align:left;width:100%}
.link-card .arrow{color:var(--ac);font-size:1.4rem}
.hub-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hub-head .eyebrow.ar{text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card.mini{padding:14px;gap:6px;cursor:pointer}
.card.mini .s-icon{width:36px;height:36px}
.panel.tools{padding:6px;gap:0}
.panel.tools .tool-row{border:0;border-bottom:1px solid var(--surface-2);border-radius:0;background:none}
.panel.tools .tool-row:disabled{opacity:.5}
.panel.tools .tool-row .s-icon{width:34px;height:34px}
.panel.tools .setting{padding:10px 14px}
.hist-row{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--surface-2)}
.hist-row b.good{color:var(--good)} .hist-row b.warn{color:var(--bad)}
.pasos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.paso{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.paso.on{border:1.5px solid var(--ac)}
.paso-n{flex:none;width:32px;height:32px;border-radius:50%;background:color-mix(in srgb, var(--ac) 14%, var(--surface));color:var(--ac);display:grid;place-items:center;font-weight:700}
.paso.on .paso-n{background:var(--ac);color:var(--bg)}
.paso-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge.ok{background:var(--good-soft);color:var(--good)}
.btn.lab{background:var(--area-lab);border-color:var(--area-lab);color:var(--bg)}
.btn.lab-ghost{border:1.5px solid var(--area-lab);color:var(--area-lab);background:var(--surface)}
details.extra{border:1px dashed var(--line);border-radius:14px;background:color-mix(in srgb, var(--surface) 55%, transparent);padding:0 16px}
details.extra summary{display:flex;align-items:center;gap:10px;min-height:56px;cursor:pointer;list-style:none}
details.extra summary::-webkit-details-marker{display:none}
details.extra summary .stack{flex-grow:1}
details.extra summary .arrow{transition:transform .2s;font-size:1.3rem;color:var(--muted)}
details.extra[open] summary .arrow{transform:rotate(90deg)}
.extra-chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:16px}
/* ---------- Video con teleprompter ---------- */
body.vid-full{overflow:hidden}
.vid-stage{position:fixed;inset:0;z-index:50;background:#000;color:#fff;overflow:hidden}
.vid-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid-stage video.mirror{transform:scaleX(-1)}
.tp{position:absolute;left:0;right:0;top:0;height:40%;overflow:hidden;padding:56px 22px 0;box-sizing:border-box;background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,.62) 80%,rgba(0,0,0,0));font-family:var(--font-body);font-weight:700;line-height:1.45;text-align:center;cursor:pointer;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 60px,#000 75%,transparent)}
.tp p{margin:0 0 .8em;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tp-s{font-size:1.25rem} .tp-m{font-size:1.6rem} .tp-l{font-size:2.05rem}
.tp-pad{height:30px} .tp-pad.end{height:40vh}
.tp.paused{outline:2px dashed rgba(255,255,255,.5);outline-offset:-6px}
.vid-cd{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:7rem;font-weight:800;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6);pointer-events:none}
.vid-bar{position:absolute;left:0;right:0;bottom:calc(31px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;padding:0 24px;pointer-events:none}
.vid-bar .vid-ic{pointer-events:auto}
.vid-ic{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:1.5rem;line-height:1;display:grid;place-items:center;padding:0}
.vid-ic.sm{width:40px;height:40px;font-size:1.3rem}
.vid-ic:disabled{opacity:.35}
.vid-speed{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;background:rgba(0,0,0,.45);border-radius:99px;padding:4px;white-space:nowrap}
.vid-rec{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;padding:0}
.vid-rec span{width:56px;height:56px;border-radius:50%;background:#e5483b;transition:all .2s}
.vid-rec.live span{width:28px;height:28px;border-radius:6px}
.vid-rec:disabled{opacity:.6}
.vid-clock{position:absolute;right:16px;top:calc(40% + 12px);background:rgba(229,72,59,.9);color:#fff;font-weight:700;font-size:.9rem;border-radius:99px;padding:4px 10px;font-variant-numeric:tabular-nums}
.vid-err{position:absolute;left:16px;right:16px;bottom:120px;background:rgba(181,61,51,.92);color:#fff;border-radius:12px;padding:10px 14px;margin:0}
.vid-play{width:100%;max-height:62vh;border-radius:14px;background:#000}
.panel.vid-cta{border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
.btn svg{width:18px;height:18px;vertical-align:-3px}
.card.pilar.tipo{cursor:default}
button.card.pilar.tipo{cursor:pointer}
.tipo-sel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.92rem}
.tipo-sel svg{width:20px;height:20px;color:var(--area-acad);flex:none}
/* ---------- Intro animada (primera vez) ---------- */
body.en-intro .top{display:none}
.intro{display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 56px);min-height:calc(100svh - 56px);padding-top:14px}
body.en-intro .wrap{padding-block-end:16px}
.in-top{display:flex;align-items:center;gap:12px}
.in-prog{flex:1;display:flex;gap:5px}
.in-prog i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.in-prog i.done{background:var(--accent)}
.in-prog i.now::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;animation:inFill var(--ms) linear both}
@keyframes inFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in-skip{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;padding:8px 4px;min-height:40px;cursor:pointer}
.in-scene{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;animation:inUp .5s cubic-bezier(.2,.8,.2,1) both;min-height:0}
@keyframes inUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in-vis{min-height:220px;display:flex;align-items:center;justify-content:center}
.in-t{font-family:var(--font-display);font-size:1.75rem;line-height:1.15;margin:4px 0 0}
.in-s{margin:0;color:var(--muted);font-size:1.02rem;line-height:1.5}
.in-bot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.in-bot .btn.primary{min-width:150px;min-height:50px}
.in-foto{width:100%}
.in-foto .photo{animation:none}
.in-files,.in-cal,.in-voz,.in-sil{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.in-file{display:flex;align-items:center;gap:10px;width:min(280px,90%);padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--elev);animation:inSlide .6s cubic-bezier(.2,.8,.2,1) var(--d) both}
.in-file svg{width:22px;height:22px;color:var(--accent);flex:none}
@keyframes inSlide{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.in-ok{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--good-soft);color:var(--good);font-weight:700;font-size:.92rem;animation:inPop .45s cubic-bezier(.2,.9,.3,1.3) var(--d) both}
.in-ok svg{width:18px;height:18px}
@keyframes inPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.in-cal{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px;max-width:330px}
.in-day{width:96px;height:78px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.in-day small{color:var(--muted);font-weight:700}
.in-day svg{width:26px;height:26px;color:var(--good);animation:inPop .4s cubic-bezier(.2,.9,.3,1.3) var(--d) both}
.in-day.dd{border:2px solid var(--accent);background:var(--accent-soft);animation:inPop .5s cubic-bezier(.2,.9,.3,1.3) var(--d) both}
.in-day.dd b{color:var(--accent);font-size:1.3rem}
.in-mic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);animation:inPulse 1.6s ease-in-out infinite}
.in-mic svg{width:34px;height:34px}
@keyframes inPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent)}50%{box-shadow:0 0 0 14px transparent}}
.in-wave{display:flex;align-items:center;gap:5px;height:36px}
.in-wave i{width:6px;height:100%;border-radius:4px;background:var(--accent);transform-origin:center;animation:inWave .9s ease-in-out var(--d) infinite alternate}
@keyframes inWave{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.in-frase{margin:0;text-align:center;font-size:1.05rem;line-height:1.5;max-width:320px}
.in-frase span{opacity:.18;animation:inWord .3s ease var(--d) forwards}
@keyframes inWord{to{opacity:1}}
.in-lugares{display:flex;gap:14px}
.in-lugares span{display:flex;flex-direction:column;align-items:center;gap:4px;width:78px;padding:10px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line);animation:inLugar 3s ease-in-out var(--d) infinite}
.in-lugares svg{width:30px;height:30px;color:var(--area-acad)}
.in-lugares small{font-weight:700;color:var(--muted)}
@keyframes inLugar{0%,30%,100%{transform:none;border-color:var(--line)}12%{transform:translateY(-6px);border-color:var(--accent)}}
.in-huecos{margin:0;text-align:center;font-size:1.05rem;line-height:1.9;max-width:330px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.in-huecos .hz{display:inline-block;min-width:96px;border-bottom:2px solid var(--accent);color:transparent;animation:inType .5s steps(10) var(--d) forwards}
@keyframes inType{to{color:var(--accent)}}
@media (prefers-reduced-motion:reduce){.intro *{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important}.in-prog i.now::after{animation:none;transform:scaleX(1)}}
@media (max-height:640px){.in-vis{min-height:170px}.in-t{font-size:1.45rem}}
/* ---------- Pitch y video currículum ---------- */
.tipo-opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border-radius:14px !important;width:100%;padding:12px 14px !important}
.tipo-list{display:flex;flex-direction:column;gap:10px}
.opt-list{gap:6px}
.opt-list .tipo-opt{padding:9px 12px !important;font-size:.92rem;line-height:1.35}
.opt-own{font-size:.8rem;color:var(--muted);font-weight:400;margin-top:4px}
.opt-own:empty{display:none}
.opt-more{align-self:flex-start;font-size:.85rem}
.cv-sug{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.cv-sug p{margin:0;line-height:1.45}
.cv-sug .row{gap:8px;align-items:center}
.cv-sug.on{outline:2px solid var(--accent);outline-offset:-2px}
.cv-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cv-pick{padding:8px 12px;font-size:.88rem;min-height:40px}
.cv-update{position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px));z-index:4;display:flex;flex-direction:column;gap:6px;padding:10px;margin:0 -4px;border-radius:16px;background:color-mix(in srgb, var(--bg) 94%, transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.14);border:1px solid var(--line)}
.cv-update .btn{min-height:52px;font-size:1rem}
.cv-done{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:color-mix(in srgb, var(--good) 12%, var(--surface));border:1px solid color-mix(in srgb, var(--good) 40%, var(--line))}
.cv-done p{margin:0;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.cv-done p svg{width:20px;height:20px;flex:none;color:var(--good)}
#ptGuion.flash{outline:3px solid var(--accent);transition:outline-color 1.2s}
.pt-save{display:flex;flex-direction:column;gap:8px;margin-top:4px;padding:10px;border-radius:16px;background:color-mix(in srgb, var(--bg) 94%, transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.14);border:1px solid var(--line)}
#ptSave:has(.pt-save){position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px));z-index:4}
.pt-save .btn svg,#ptSave .fb svg{width:18px;height:18px;vertical-align:-4px}
.kchip.ya{opacity:.75}
.cv-blk .cv-pick{align-self:flex-start}
.cv-blk small.muted svg{width:16px;height:16px;vertical-align:-3px}
.cv-logros li{margin-bottom:8px}
.cv-logros .cv-pick{margin-top:6px}
.cv-update{margin-top:8px}
.q-card{display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--ac);text-align:left}
.q-card .pill-cta{align-self:flex-start}
.top-acts{display:flex;gap:8px}
.top-set[hidden]{display:none}
.op-pre{white-space:pre-wrap;font-family:var(--font-mono);font-size:.78rem;line-height:1.5;margin:6px 0 0;color:var(--muted)}
.op-nota .pw-opt{min-width:48px;justify-content:center}
.cv-h{margin:8px 0 0;font-size:1.05rem}
.cv-rev{display:flex;flex-direction:column;gap:4px;margin:0}
.cv-rev small{font-weight:400;opacity:.85}
.cv-blk{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.cv-blk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cv-blk p,.cv-blk ul{margin:0;line-height:1.5}
.cv-blk ul{padding-left:18px}
.pro-card.lock .tag{display:inline-flex;align-items:center;gap:5px}
.pro-card.lock svg{width:14px;height:14px}
.pro-card.lock .btn{align-self:flex-start}
.pro-card.lock .btn[disabled]{opacity:.6;cursor:not-allowed}
.note.real{padding:10px 12px;border-radius:12px;background:var(--surface-2);margin:0}
.comp-sug .pw-opt{padding:6px 12px;font-size:.84rem;min-height:36px}
.tipo-opt small{font-weight:400;color:var(--muted);line-height:1.4}
.pt-exp{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--surface-2)}
.pt-exp:last-of-type{border-bottom:0}
.pt-prev{padding:14px 16px;border-radius:14px;background:var(--surface-2);border-left:3px solid var(--area-lab)}
.pt-prev p{margin:6px 0 0;font-size:1rem;line-height:1.55}
.kchip .x{border:0;background:none;color:inherit;font-size:1rem;padding:0 0 0 6px;cursor:pointer;line-height:1}
.ck-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:.95rem;cursor:pointer}
.ck-row input{width:20px;height:20px;margin-top:1px;accent-color:var(--area-lab);flex:none}
/* ---------- Entrevistas: Conócete, logros, respuestas ---------- */
.sub-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.sub-row{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;text-align:left;width:100%}
.sub-row .arrow,.hoy-row .arrow{color:var(--muted);font-size:1.3rem}
.hoy-row.ok-r .hoy-ck{border:0}
.id-card{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.id-card p{margin:0;font-weight:700}
.id-card.si{border-color:var(--area-lab);background:color-mix(in srgb, var(--area-lab) 7%, var(--surface))}
.id-card.no{opacity:.85}
.chip-btn{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;font-size:.88rem;font-weight:700}
.chip-btn.on{border-color:var(--area-lab);background:var(--area-lab);color:var(--bg)}
.est-bars{display:flex;flex-direction:column;gap:6px;margin:12px 0 4px}
.est-bar{display:grid;grid-template-columns:96px 1fr 24px;align-items:center;gap:8px;font-size:.85rem}
.est-bar .bar i{background:var(--area-lab)}
.comp-g{gap:0}
.comp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--surface-2)}
.comp-row:last-child{border-bottom:0}
.comp-row small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:2px}
.comp-lv{display:flex;gap:4px;flex:none}
.comp-lv button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:700;padding:0}
.comp-lv button.on{background:var(--area-lab);border-color:var(--area-lab);color:var(--bg)}
.ideas{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:.9rem;line-height:1.6}
.card.logro-card{text-align:left}
.tipo-opt small{display:block}
.fd-none{margin:0;padding:22px 16px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);cursor:pointer}
.flash{display:block;width:100%;min-height:220px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--elev);padding:22px;text-align:left}
.flash-in{display:flex;flex-direction:column;gap:12px}
.flash.flip{border-color:var(--accent)}
.breath{width:150px;height:150px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:radial-gradient(circle, var(--accent-soft), transparent 70%);border:2px solid var(--accent);font-weight:700;transform:scale(.7);transition:transform 4s ease-in-out}
.breath[data-ph="Inhala"]{transform:scale(1);transition-duration:4s}
.breath[data-ph="Sostén"]{transform:scale(1)}
.breath[data-ph="Exhala"]{transform:scale(.7);transition-duration:6s}
.traba{margin:0;font-family:var(--font-display);font-size:1.1rem}
.traba.big{font-size:1.3rem;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.ensayo{align-items:stretch}
.timer{display:flex;align-items:baseline;justify-content:center;gap:8px}
.timer b{font-size:2.6rem}
.timer span{color:var(--muted)}
.tbar.over i{background:var(--bad)!important}
.cues{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--surface-2);font-size:.9rem}
.cues p{margin:0}
.transcript.small{font-size:.85rem;max-height:120px;overflow:auto}
.cov-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.cov-row span:last-child{display:flex;flex-direction:column}
.cov-row small{color:var(--muted)}
.cov-ic{flex:none;min-width:34px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:.8rem;font-weight:700;font-family:var(--font-mono)}
.cov-ic.ok{background:var(--good-soft);color:var(--good)}.cov-ic.mid{background:var(--accent-soft);color:var(--accent)}.cov-ic.no{background:var(--bad-soft);color:var(--bad)}
.kpi b.good{color:var(--good)}.kpi b.warn{color:var(--bad)}
@media (prefers-reduced-motion: reduce){.breath{transition:none}}
mark.con{background:color-mix(in srgb, var(--area-lab) 16%, transparent);color:inherit;border-bottom:2px solid var(--area-lab);border-radius:3px;padding:0 2px}
.con-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.con-map div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border-left:3px solid var(--area-lab);min-width:0}
.con-map b{font-size:.85rem}
.con-map span{font-size:.9rem}
.con-map small{color:var(--muted);font-size:.78rem}
@media (max-width:360px){.con-map{grid-template-columns:1fr}}
.puente{display:flex;flex-direction:column;gap:6px;padding:4px 6px 4px 22px;border-left:2px dashed var(--area-lab);margin-left:18px}
.puente-l{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--area-lab)}
.puente-l svg{width:16px;height:16px}
.puente input{min-height:40px;font-size:.9rem}
.pb-dif summary{cursor:pointer;font-size:.85rem;font-weight:700}
.pb-dif .kchip{margin:4px 4px 0 0}
.dif-add{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.dif-add input{min-height:40px;font-size:.9rem}
.dif-add .btn{justify-self:start}
.rel-frase{font-size:1.18rem;line-height:1.6;margin:0}
.rel-blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--area-lab);color:var(--area-lab);font-weight:700;text-align:center}
.rel-blank.fill{border-bottom-style:solid}
.rel-bar i{background:var(--area-lab)!important;transition:width .06s linear}
.salv{padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb, var(--area-lab) 10%, var(--surface));border:1px solid color-mix(in srgb, var(--area-lab) 30%, var(--line));display:flex;flex-direction:column;gap:8px}
.salv p{margin:0;font-size:.92rem}
.salv-mini{border-left:3px solid var(--area-lab);padding-left:10px}
.cue-p{color:var(--area-lab);font-size:.85rem}
.frase{font-weight:500;font-family:var(--font-body);font-size:1.15rem}
</style>
