<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="description" content="Entrena cómo suenas: vocabulario por contexto y simulaciones de conversación.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aura">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Aura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna pensada para celular, con barra inferior de 4 secciones (Inicio, Práctica, Progreso, Ajustes).
   Identidad deliberadamente única: negro y dorado en cualquier tema del sistema. El anillo dorado es el único gesto visual fuerte. */
:root{
  --bg:#0a0a0b; --surface:#131210; --surface-2:#1c1a16; --line:#2f2a20;
  --fg:#f4eee0; --muted:#a69f8c;
  --accent:#d4af37; --accent-ink:#0a0a0b; --gold-dark:#8f6b1e; --gold-light:#f6e09a; --hair:#2a251b;
  --good:#8cc79a; --bad:#e08a6b; --good-soft:rgba(140,199,154,.12); --bad-soft:rgba(224,138,107,.12); --accent-soft:rgba(212,175,55,.12);
  --font-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --nav-h:68px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em;color:var(--fg)}
h1{font-size:clamp(2rem,6vw,2.75rem);font-weight:800;line-height:1.05}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:1.5rem;font-weight:700;line-height:1.15}
h3{font-size:1.125rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.lead{color:var(--muted);max-width:44ch;margin-top:10px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.35rem;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;color:var(--fg)}
.brand small{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.mark{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.95rem;color:var(--accent);border:2px solid var(--accent);box-shadow:0 0 12px rgba(212,175,55,.35), inset 0 0 6px rgba(212,175,55,.15)}
.pill{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--accent);border:1px solid var(--line)}

/* Bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:700;position:relative;letter-spacing:.02em}
.nav button svg{width:22px;height:22px;transition:transform .25s ease}
.nav button.on{color:var(--accent)}
.nav button.on svg{transform:translateY(-1px) scale(1.08)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 2px 2px;background:var(--accent);box-shadow:0 0 10px rgba(212,175,55,.6)}

/* Page transitions */
.view.anim-up{animation:enterUp .34s cubic-bezier(.2,.8,.2,1) both}
.view.anim-right{animation:enterRight .34s cubic-bezier(.2,.8,.2,1) both}
.view.anim-left{animation:enterLeft .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes enterUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes enterRight{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes enterLeft{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.section{padding-top:20px;display:flex;flex-direction:column;gap:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,var(--gold-light) -40%,var(--accent) 55%,var(--gold-dark) 160%);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 50%, var(--line))}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;align-self:flex-start}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* Hero illustration */
.art{width:100%;max-width:440px;margin:0 auto;display:block}
.art .glow{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
.art .p-body{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.art .p-body2{fill:var(--surface-2);stroke:var(--gold-dark);stroke-width:2}
.art .p-hair{fill:var(--hair);stroke:var(--accent);stroke-width:2}
.art .p-hair2{fill:var(--hair);stroke:var(--gold-dark);stroke-width:2}
.art .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.art .bubble{fill:var(--surface);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.art .bubble2{fill:var(--surface-2);stroke:var(--gold-dark);stroke-width:2;stroke-linejoin:round}
.art .aa{font-family:var(--font-display);font-weight:700;font-size:21px;fill:var(--accent)}
.art .dot{fill:var(--gold-light)}
.art .spark{stroke:var(--gold-light);stroke-width:1.6;stroke-linecap:round}
.hero{display:flex;flex-direction:column;gap:6px;padding-top:12px}

/* Home */
.greet{display:flex;align-items:center;gap:14px;padding-top:22px}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--accent);border:2px solid var(--accent);background:var(--surface);box-shadow:0 0 18px rgba(212,175,55,.25)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
button.card:hover{border-color:var(--accent)}
.card.feature{border-color:color-mix(in srgb, var(--accent) 45%, var(--line));background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 9%, var(--surface)), var(--surface) 60%)}
.card .meta{font-size:.88rem;color:var(--muted)}
.card-head{display:flex;align-items:center;gap:12px}
.s-icon{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb, var(--accent) 30%, transparent)}
.s-icon svg{width:22px;height:22px}
.cta{color:var(--accent);font-weight:700;font-size:.92rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);align-self:flex-start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold-dark),var(--accent),var(--gold-light));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.barlabel{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px;min-width:0;border:1px solid var(--line)}
.kpi b{font-family:var(--font-mono);font-size:1.2rem;display:block;color:var(--fg);font-variant-numeric:tabular-nums}
.kpi span{font-size:.76rem;color:var(--muted)}

/* Ring */
.ring{--p:0;--size:120px;width:var(--size);height:var(--size);border-radius:50%;position:relative;display:grid;place-items:center;flex:none;
  background:conic-gradient(from 210deg, var(--gold-dark) 0, var(--accent) calc(var(--p)*.5%), var(--gold-light) calc(var(--p)*1%), var(--surface-2) calc(var(--p)*1%));}
.ring::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle, rgba(212,175,55,.28) 0, transparent 70%);opacity:calc(.25 + var(--p)/140);z-index:-1}
.ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;z-index:1;text-align:center;line-height:1.1}
.ring b{font-family:var(--font-display);font-size:1.8rem;font-weight:800;display:block}
.ring small{font-size:.7rem;color:var(--muted)}
.ring-row{display:flex;align-items:center;gap:20px;padding-top:22px}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--font-mono);font-size:10px}
.chart .val{fill:var(--fg);font-family:var(--font-mono);font-size:11px}
.chart .b{fill:var(--accent)}
.chart .b:hover{fill:var(--gold-light)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.92rem;text-align:center}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.srow .s-icon{width:36px;height:36px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:.85rem;font-weight:700;color:var(--fg)}
input[type="text"]{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
input[type="text"]:focus{border-color:var(--accent);outline:none}
input[type="range"]{width:100%;accent-color:var(--accent)}
.chips-opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:400px){.chips-opt{grid-template-columns:1fr}}
.chip-opt{position:relative}
.chip-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip-opt span{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:.9rem;min-height:44px}
.chip-opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.chip-opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.conf-out{font-size:.85rem;color:var(--accent);font-weight:700}
.err{color:var(--bad);font-size:.85rem;min-height:1em}
.toast{padding:10px 14px;border-radius:12px;background:var(--good-soft);border-left:3px solid var(--good);font-size:.92rem}

/* Settings */
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting p{font-size:.95rem}
.setting small{display:block;color:var(--muted);font-size:.8rem}
.switch{width:50px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);position:relative;flex:none;padding:0;transition:background .2s}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .22s cubic-bezier(.2,.8,.2,1), background .2s}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] .knob{transform:translateX(20px);background:var(--accent)}
.switch[disabled]{opacity:.4;cursor:not-allowed}

/* Stepper */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;min-width:0}
.step .n{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
.step b{display:block;font-size:.95rem}
.step.on{border-color:var(--accent);background:var(--accent-soft)}

/* Vocab */
.vocab{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vrow .from{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--bad) 60%, transparent)}
.vrow .to{font-weight:700}
.vrow .alt{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.arrow{color:var(--accent);font-family:var(--font-mono)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.vhead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto;gap:10px;padding:0 14px}
@media (max-width:480px){.vrow,.vhead{grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr)}.vrow .dots,.vhead .dh{display:none}}
.crit{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.92rem}

/* Question / chat */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);min-height:44px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--good-soft);border-left:3px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:3px solid var(--bad)}
.fb.mid{background:var(--accent-soft);border-left:3px solid var(--accent)}
.blank{display:inline-block;min-width:4ch;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700}
.say{display:flex;gap:10px;align-items:flex-start}
.bubble{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:12px 14px;flex:1;min-width:0}
.bubble .who{font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:2px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;color:var(--fg)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
textarea{width:100%;min-height:110px;resize:vertical;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hint{font-size:.88rem;color:var(--muted)}
.hint b{color:var(--fg)}
.note{font-size:.85rem;color:var(--muted)}
.dotsprog{display:flex;gap:6px}
.dotsprog i{flex:1;height:4px;border-radius:99px;background:var(--surface-2)}
.dotsprog i.done{background:var(--accent)}

/* Results */
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-family:var(--font-display);font-size:3.5rem;font-weight:800;line-height:1}
.turn{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.turn:first-of-type{border-top:0;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip.no{border-color:var(--bad);color:var(--bad)}
.delta{font-family:var(--font-mono);color:var(--good);font-size:.9rem}
.recs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:12px;background:var(--bad-soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" data-act="brand" aria-label="Ir al inicio"><span class="mark" aria-hidden="true">Aa</span>Aura <small>confianza verbal</small></button>
  <span class="pill" id="levelPill">Aprendiz</span>
</div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="nav" aria-label="Secciones">
  <div class="nav-in">
    <button data-act="tab" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Inicio</button>
    <button data-act="tab" data-tab="practica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Práctica</button>
    <button data-act="tab" data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M6 16v-4"/><path d="M11 16V7"/><path d="M16 16v-6"/><path d="M20 16V4"/></svg>Progreso</button>
    <button data-act="tab" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Ajustes</button>
  </div>
</nav>

<script>
/* ===================== CONTENIDO (borrador v1 para revisión) ===================== */
const SCENARIOS = [
{
  id:"presentacion", name:"Presentación en la universidad", short:"una presentación de proyecto",
  who:"Profesora (comisión)", blurb:"Expón tu proyecto y responde preguntas de la comisión.",
  labels:["Coloquial","Profesional"],
  crit:"Se evalúa precisión del vocabulario, estructura y pocas muletillas. Formal, pero sin sonar rebuscado.",
  weights:{v:.6,m:.25,p:.15},

SCENARIOS.forEach(s=>s.words.forEach((w,i)=>w.id=s.id+"-"+i));

/*LOGIC-START*/
const MUL_PHRASES = ["o sea","como que","como onda","es que nada"];
const MUL_TOKENS = ["osea","cachai","cachay","eh","ehh","ehhh","em","emm","mm","mmm","po","literal","basicamente"];
const PPM_RANGE = [110,160];
const PPM_MAX_RELIABLE = 260;   // nadie habla sostenidamente sobre ~260 palabras/min: sobre eso, el dato es un error de medición

/* Chrome en Android entrega la frase ACUMULADA en cada resultado ("debería", "debería llevárselo", ...).
   Para no duplicar, si un fragmento nuevo empieza igual que el anterior, lo REEMPLAZA en vez de sumarse. */
function sameStart(a, b){
  const aw=a.split(" "), bw=b.split(" ");
  if(bw.length<aw.length) return false;
  const k=Math.max(1, Math.floor(aw.length*0.7));
  let same=0; for(let i=0;i<k;i++) if(aw[i]===bw[i]) same++;
  return same >= Math.ceil(k*0.8);   // tolera que el reconocedor corrija alguna palabra
}
function mergePart(parts, t){
  const last=parts[parts.length-1];
  if(!last){ parts.push(t); return parts; }
  const a=norm(last), b=norm(t);
  if(!b) return parts;
  if(b.startsWith(a) || sameStart(a,b)){ parts[parts.length-1]=t; return parts; }
  if(a.startsWith(b) || sameStart(b,a)) return parts;   // repetición más corta de lo mismo
  parts.push(t); return parts;
}
function buildTranscript(chunks){ return chunks.reduce((parts,t)=>mergePart(parts,(t||"").trim()),[]).join(" "); }

function norm(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[¿?¡!.,;:"“”«»()\[\]…]/g," ").replace(/\s+/g," ").trim();
}
function tokens(s){ const n=norm(s); return n? n.split(" "):[]; }
function hasStem(text, stem){
  const n=" "+norm(text)+" ", st=norm(stem);
  if(st.includes(" ")||st.includes("-")) return n.includes(" "+st);
  return tokens(text).some(t=>t.startsWith(st));
}
function countMuletillas(text){
  const n=" "+norm(text)+" ", toks=tokens(text), found={}; let count=0;
  MUL_PHRASES.forEach(p=>{ const re=new RegExp(" "+p+"(?= )","g"); const m=n.match(re); if(m){found[p]=(found[p]||0)+m.length; count+=m.length;} });
  toks.forEach((t,i)=>{
    let hit = MUL_TOKENS.includes(t);
    if(t==="tipo" && !["de","del"].includes(toks[i+1])) hit=true;
    if(hit){found[t]=(found[t]||0)+1; count++;}
  });
  return {count, found};
}
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function paceScore(ppm){
  if(ppm>=PPM_RANGE[0] && ppm<=PPM_RANGE[1]) return 1;
  return ppm<PPM_RANGE[0] ? clamp01((ppm-60)/(PPM_RANGE[0]-60)) : clamp01((220-ppm)/(220-PPM_RANGE[1]));
}
/* S = w1·vocab + w2·(1 − min(1, muletillas/umbral)) + w3·f(PPM)  — sin voz, se omite el ritmo y se renormaliza */
function scoreFree(turn, text, meta, weights, scen){
  const matched=[], missing=[];
  turn.groups.forEach((g,i)=>{ (g.some(st=>hasStem(text,st)) ? matched : missing).push(turn.hint[i]||g[0]); });
  const v = turn.groups.length ? matched.length/turn.groups.length : 0;
  const mul = countMuletillas(text);
  const nWords = tokens(text).length;
  let m, ppm=null, p=null;
  const notes=[];
  let voice = !!(meta && meta.voice && meta.seconds && meta.seconds>=3);
  if(voice){
    ppm = nWords/(meta.seconds/60);
    if(ppm>PPM_MAX_RELIABLE){ voice=false; ppm=null; notes.push("El ritmo medido no fue confiable (posible error del micrófono), así que se evaluó sin ritmo."); }
  }
  if(voice){ const tm = mul.count/(meta.seconds/60); m = 1-Math.min(1, tm/4); p = paceScore(ppm); }
  else { m = 1-Math.min(1, mul.count/3); }
  let S = voice ? (weights.v*v + weights.m*m + weights.p*p) : (weights.v*v + weights.m*m)/(weights.v+weights.m);
  if(nWords<5){ S=Math.min(S,.5); notes.push("Respuesta muy corta: intenta desarrollar la idea en una o dos frases."); }
  const uniq=new Set(tokens(text)).size;
  if(nWords>=20 && uniq/nWords<0.35){ S=Math.min(S,.5); notes.push("Detectamos muchas palabras repetidas. Revisa que la transcripción refleje lo que dijiste."); }
  const colloquial=[];
  if(scen) scen.words.forEach(w=>{ (w.det||[]).forEach(d=>{ if(hasStem(text,d) && !colloquial.find(c=>c.col===w.col)) colloquial.push({col:w.col, pro:w.pro}); }); });
  return {S:clamp01(S), v, m, p, ppm, nWords, mul, matched, missing, colloquial, notes, voice:!!voice};
}
function emptyProgress(){ return {words:{}, sims:{}}; }
function scenarioProgress(prog, scen){
  const boxes = scen.words.map(w=>Math.min(3, prog.words[w.id]||0)/3);
  const mastery = boxes.reduce((a,b)=>a+b,0)/boxes.length;
  const best = (prog.sims[scen.id] && prog.sims[scen.id].best)||0;
  return Math.round((0.6*mastery + 0.4*best/100)*100);
}
function globalProgress(prog, scens){ return Math.round(scens.reduce((a,s)=>a+scenarioProgress(prog,s),0)/scens.length); }
/*LOGIC-END*/

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function cap(s){ return s.charAt(0)==="¿"||s.charAt(0)==="¡" ? s.charAt(0)+s.charAt(1).toUpperCase()+s.slice(2) : s.charAt(0).toUpperCase()+s.slice(1); }
function atSentenceStart(tpl){ const before=tpl.slice(0,tpl.indexOf("___")).trim(); return before==="" || /[.!?¡¿:]$/.test(before); }
function fillHTML(tpl, filled){ return esc(tpl).replace("___", `<span class="blank">${filled?esc(filled):"&nbsp;&nbsp;&nbsp;&nbsp;"}</span>`); }

function pct(x){ return Math.round(x*100); }
function dayKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return dayKey(new Date()); }
function markDay(){ const t=today(); if(!progress.days.includes(t)){ progress.days.push(t); if(progress.days.length>400) progress.days=progress.days.slice(-400); } }
function streak(){
  const set=new Set(progress.days), d=new Date(); let n=0;
  if(!set.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(set.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function levelOf(g){ let cur=LEVELS[0], next=null; LEVELS.forEach((l,i)=>{ if(g>=l[0]){ cur=l; next=LEVELS[i+1]||null; } }); return {name:cur[1], next}; }
function masteredCount(){ return SCENARIOS.reduce((a,s)=>a+s.words.filter(w=>(progress.words[w.id]||0)>=3).length,0); }
function initials(n){ return (n||"").trim().split(/\s+/).slice(0,2).map(x=>x.charAt(0).toUpperCase()).join("")||"Aa"; }
function recommend(){
  const g=progress.profile && progress.profile.goal;
  if(g && scenarioProgress(progress, scenById(g))<100) return scenById(g);
  return SCENARIOS.slice().sort((a,b)=>scenarioProgress(progress,a)-scenarioProgress(progress,b))[0];
}

/* ===================== SONIDOS (Web Audio API) ===================== */
let actx=null;
function tone(freq, start, dur, vol){
  const o=actx.createOscillator(), g=actx.createGain(), o2=actx.createOscillator(), g2=actx.createGain();
  o.type="sine"; o.frequency.value=freq; o2.type="sine"; o2.frequency.value=freq*2.01;
  [[g,vol],[g2,vol*.22]].forEach(([gn,v])=>{ gn.gain.setValueAtTime(0.0001,start); gn.gain.exponentialRampToValueAtTime(v,start+0.012); gn.gain.exponentialRampToValueAtTime(0.0001,start+dur); });
  o.connect(g).connect(actx.destination); o2.connect(g2).connect(actx.destination);
  o.start(start); o2.start(start); o.stop(start+dur+0.05); o2.stop(start+dur+0.05);
}
function playNotes(notes, kind){
  const st=progress.settings;
  if(!st.sound) return;
  if(kind==="click" && !st.clicks) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx=actx||new AC(); if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime+0.02;
    notes.forEach(([f,dt,dur,vol])=>tone(f,t+dt,dur,vol||0.16));
  }catch(e){}
}
function chime(){ playNotes([[1046.5,0,.35],[1568,.09,.5]],"fx"); }
function fanfare(){ playNotes([[784,0,.4],[1046.5,.12,.4],[1318.5,.24,.7]],"fx"); }
function softMiss(){ playNotes([[440,0,.22,.07],[349.2,.11,.32,.07]],"fx"); }

function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const voices=speechSynthesis.getVoices();
    const pick=["es-CL","es-419","es-US","es-MX","es-ES"].map(l=>voices.find(v=>v.lang&&v.lang.replace("_","-").startsWith(l))).find(Boolean) || voices.find(v=>v.lang&&v.lang.startsWith("es"));
    if(pick){u.voice=pick; u.lang=pick.lang;} else u.lang="es-CL";
    u.rate=1; speechSynthesis.speak(u);
  }catch(e){}
}
let rec=null;
function toggleMic(){
  const ta=document.getElementById("answer"), btn=document.getElementById("micBtn"), st=document.getElementById("micStatus");
  if(rec){ try{rec.stop();}catch(e){} return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ st.textContent="Tu navegador no reconoce voz. Escribe tu respuesta (en Chrome sí funciona)."; return; }
  let base=ta.value.trim(), finalText="", t0=null, t1=null;
  try{
    rec=new SR(); rec.lang="es-CL"; rec.continuous=true; rec.interimResults=true;
    rec.onresult=e=>{
      const now=performance.now(); if(t0===null) t0=now;
      const chunks=[]; let anyFinal=false;
      for(let i=0;i<e.results.length;i++){ const r=e.results[i]; chunks.push(r[0].transcript); if(r.isFinal) anyFinal=true; }
      if(anyFinal) t1=now;
      finalText=buildTranscript(chunks);
      ta.value=(base?base+" ":"")+finalText;
    };
    rec.onerror=e=>{
      st.textContent = e.error==="not-allowed"||e.error==="service-not-allowed"
        ? "El micrófono no está disponible aquí. Revisa el permiso del navegador o escribe tu respuesta."
        : "No se pudo reconocer la voz ("+e.error+"). Intenta de nuevo o escribe.";
    };
    rec.onend=()=>{
      rec=null; btn.classList.remove("rec"); btn.setAttribute("aria-pressed","false");
      if(finalText.trim()){ S.voiceMeta={voice:true, seconds: t0!==null&&t1!==null ? (t1-t0)/1000 + 1 : null}; st.textContent="Listo. Revisa el texto y envía."; }
    };
    rec.start(); btn.classList.add("rec"); btn.setAttribute("aria-pressed","true"); st.textContent="Escuchando... toca de nuevo para terminar.";
  }catch(e){ rec=null; st.textContent="No se pudo iniciar el micrófono. Escribe tu respuesta."; }
}

    const ok=q.opts[P.answered]===w.pro;

      <div class="row"><button class="btn primary" data-act="pNext">${P.i<P.qs.length-1?"Siguiente":"Ir a la simulación"}</button></div>`;
  }
  return `<section class="section"><button class="back" data-act="open" data-id="${s.id}">← ${esc(s.name)}</button>

function startSim(){
  const s=scen();
  S.sim={i:0, results:[], answered:null, order: s.sim.map(t=>t.type==="free"?null:shuffle(t.opts.map((_,k)=>k)))};
  S.voiceMeta=null;
  if(!(S.practiceDone && S.practiceDone.sid===s.id)) S.practiceDone=null;
  go({view:"sim"},"right");
  if(progress.settings.autoSpeak) speak(s.sim[0].say);
}
const LEVEL={choice:"Nivel 1 · Elige la mejor respuesta", fill:"Nivel 2 · Completa la frase", free:"Nivel 3 · Responde con tus palabras"};
function vSim(){
  const s=scen(), M=S.sim, t=s.sim[M.i];
  let body="";
  if(t.type==="choice"||t.type==="fill"){
    const start = t.type==="fill" && atSentenceStart(t.tpl);
    const opts=M.order[M.i].map(k=>{
      const o=t.type==="choice"? t.opts[k].t : (start?cap(t.opts[k]):t.opts[k]);
      let cls="opt";
      if(M.answered!==null){ const good = t.type==="choice" ? t.opts[k].s>=1 : k===0; if(good) cls+=" ok"; else if(k===M.answered) cls+=" no"; }
      return `<button class="${cls}" data-act="sAnswer" data-k="${k}" ${M.answered!==null?"disabled":""}>${esc(o)}</button>`;}).join("");
    const tplHTML = t.type==="fill" ? `<p style="font-size:1.1rem">${fillHTML(t.tpl, M.answered!==null? (start?cap(t.opts[0]):t.opts[0]) : null)}</p>` : "";
    let fb="";
    if(M.answered!==null){ const r=M.results[M.i]; fb=`<div class="fb ${r.S>=1?"ok":r.S>=.4?"mid":"no"}"><b>${pct(r.S)} pts.</b> ${esc(r.fb)}</div>`; }
    body=`${tplHTML}<div class="opts">${opts}</div>${fb}`;
  } else {
    const r=M.answered!==null? M.results[M.i] : null;
    body = r ? freeFeedback(r) : `
      <p class="hint">Intenta usar: ${t.hint.map(h=>"<b>"+esc(h)+"</b>").join(", ")}.</p>
      <label for="answer" class="eyebrow">Tu respuesta (escribe o dicta)</label>
      <textarea id="answer" placeholder="Escribe aquí o toca el micrófono..."></textarea>
      <div class="row"><button class="icon-btn" id="micBtn" data-act="mic" aria-label="Dictar con el micrófono" aria-pressed="false">${ICON_MIC}</button>
        <button class="btn primary" data-act="sSubmit">Evaluar respuesta</button></div>
      <p class="note" id="micStatus"></p>`;
  }
  const next = M.answered!==null ? `<div class="row"><button class="btn primary" data-act="sNext">${M.i<s.sim.length-1?"Siguiente turno":"Ver resultados"}</button></div>` : "";
  return `<section class="section"><button class="back" data-act="open" data-id="${s.id}">← ${esc(s.name)}</button>
    ${stepper("startSim")}
    <div class="panel">
      <div class="qmeta"><span class="tag">${LEVEL[t.type]}</span><span class="mono muted">Turno ${M.i+1} / ${s.sim.length}</span></div>
      <div class="dotsprog">${s.sim.map((_,k)=>`<i class="${k<M.i||(k===M.i&&M.answered!==null)?"done":""}"></i>`).join("")}</div>
      <div class="say"><div class="bubble"><div class="who">${esc(s.who)}</div>${esc(t.say)}</div>
        <button class="icon-btn" data-act="speak" aria-label="Escuchar en voz alta">${ICON_SPEAK}</button></div>
      ${body}${next}
    </div></section>`;
}
function freeFeedback(r){
  const chips=[...r.matched.map(m=>`<span class="chip ok">✓ ${esc(m)}</span>`), ...r.missing.map(m=>`<span class="chip no">falta: ${esc(m)}</span>`)].join("");
  const mulList=Object.entries(r.mul.found).map(([k,n])=>`«${esc(k)}»${n>1?" ×"+n:""}`).join(", ");
  return `<div class="fb ${r.S>=.75?"ok":r.S>=.45?"mid":"no"}"><b>${pct(r.S)} pts.</b> ${r.voice?"Evaluado por voz.":"Evaluado por texto (sin ritmo)."}</div>
    <p class="muted" style="font-size:.92rem">Dijiste: «${esc(r.text)}»</p>
    <div class="chips">${chips}</div>
    <div class="kpis">
      <div class="kpi"><b>${pct(r.v)}%</b><span>vocabulario objetivo</span></div>
      <div class="kpi"><b>${r.mul.count}</b><span>muletillas${mulList?": "+mulList:""}</span></div>
      <div class="kpi"><b>${r.ppm?Math.round(r.ppm):"—"}</b><span>palabras/min${r.ppm?"":" (solo voz)"}</span></div>
    </div>
    ${r.colloquial.length?`<p class="hint">Podrías cambiar ${r.colloquial.map(c=>"«"+esc(c.col)+"» por <b>"+esc(c.pro)+"</b>").join(", ")}.</p>`:""}
    ${r.notes.map(n=>`<p class="hint">${esc(n)}</p>`).join("")}
    <div class="fb mid"><b>Respuesta modelo:</b> ${esc(r.model)}</div>`;
}
function finishSim(){
  const s=scen(), M=S.sim;
  const before=scenarioProgress(progress,s);
  const simScore=Math.round(M.results.reduce((a,r)=>a+r.S,0)/M.results.length*100);
  const recd=progress.sims[s.id]||{best:0,attempts:0,last:0};
  recd.attempts++; recd.last=simScore; recd.best=Math.max(recd.best,simScore); progress.sims[s.id]=recd;
  M.results.filter(r=>r.type==="free").forEach(r=>{ s.words.forEach(w=>{ if(hasStem(r.text, w.pro)) progress.words[w.id]=Math.min(3,(progress.words[w.id]||0)+1); }); });
  const voiced=M.results.filter(r=>r.type==="free" && r.ppm);
  const avgPpm = voiced.length ? Math.round(voiced.reduce((a,r)=>a+r.ppm,0)/voiced.length) : null;
  const avgMpm = voiced.length ? +(voiced.reduce((a,r)=>a+(r.nWords? r.mul.count*r.ppm/r.nWords : 0),0)/voiced.length).toFixed(1) : null;
  progress.history.push({d:today(), sid:s.id, score:simScore, ppm:avgPpm, mpm:avgMpm});
  if(progress.history.length>100) progress.history=progress.history.slice(-100);
  markDay(); save();
  const after=scenarioProgress(progress,s);
  const pr = S.practiceDone && S.practiceDone.sid===s.id ? S.practiceDone.correct : null;
  S.result={simScore, before, after, pr, results:M.results};
  go({view:"results"},"up");
  if(simScore>=75) setTimeout(fanfare, 250);
}
function recommendations(s, R){
  const out=[], free=R.results.filter(r=>r.type==="free");
  const mul=free.reduce((a,r)=>a+r.mul.count,0);
  const miss=[...new Set(free.flatMap(r=>r.missing))];
  const ppms=free.filter(r=>r.ppm).map(r=>r.ppm);
  const weak=R.results.filter(r=>r.type!=="free" && r.S<1);
  if(miss.length) out.push(`Practica estas expresiones en voz alta: ${miss.map(m=>"«"+esc(m)+"»").join(", ")}.`);
  if(mul>=2) out.push(`Detectamos ${mul} muletillas. Cuando necesites pensar, haz una pausa breve en silencio: suena más seguro que «o sea» o «eh».`);
  if(ppms.length){ const avg=Math.round(ppms.reduce((a,b)=>a+b,0)/ppms.length);
    if(avg>PPM_RANGE[1]) out.push(`Hablaste a ${avg} palabras por minuto: un poco rápido. Apunta a ${PPM_RANGE[0]}–${PPM_RANGE[1]}.`);
    else if(avg<PPM_RANGE[0]) out.push(`Hablaste a ${avg} palabras por minuto: algo lento. Apunta a ${PPM_RANGE[0]}–${PPM_RANGE[1]}.`); }
  else out.push("Prueba la próxima vez respondiendo por voz para medir tu ritmo y tus muletillas al hablar.");
  if(weak.length) out.push(`Revisa ${weak.length>1?"los turnos":"el turno"} ${weak.map(r=>r.turn+1).join(" y ")}: había una opción más adecuada para ${esc(s.short)}.`);
  if(s.id==="cita") out.push("En una cita, devolver la pregunta («¿y tú?») vale más que cualquier palabra elegante.");
  if(!out.length) out.push("Excelente. Repite la simulación por voz para consolidar.");
  return out;
}

function scoresChart(){
  const h=progress.history.slice(-10);
  if(!h.length) return `<p class="empty">Aún no hay simulaciones. Completa una y aquí verás cómo evolucionan tus puntajes.</p>`;
  const W=320, H=150, L=28, B=22, T=14, slot=(W-L-4)/10, bw=Math.min(18, slot*.62);
  const y=v=>T+(H-T-B)*(1-v/100);
  let g=[0,50,100].map(v=>`<line class="grid-l" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("");
  const bars=h.map((e,i)=>{
    const x=L+slot*i+(slot-bw)/2, top=y(e.score), base=y(0), r=Math.min(4,(base-top)/2);
    const d = e.score>0 ? `M${x},${base} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${base} Z` : "";
    const sc=scenById(e.sid);
    return `<g><title>Intento ${progress.history.length-h.length+i+1} · ${esc(sc?sc.name:"")} · ${e.score} pts</title>${d?`<path class="b" d="${d}"/>`:""}<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent"/></g>`;
  }).join("");
  const last=h[h.length-1], lx=L+slot*(h.length-1)+slot/2;
  const lbl=`<text class="val" x="${lx}" y="${y(last.score)-6}" text-anchor="middle">${last.score}</text>`;
  const ax=`<text class="ax" x="${L}" y="${H-6}">más antiguo</text><text class="ax" x="${W}" y="${H-6}" text-anchor="end">más reciente</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntajes de las últimas ${h.length} simulaciones: ${h.map(e=>e.score).join(", ")}">${g}${bars}${lbl}${ax}</svg></div>`;
}

/* ===================== EVENTOS ===================== */
document.addEventListener("click", onAct);
app.addEventListener("input", e=>{
  if(e.target.id==="profConf"){ const v=+e.target.value; const o=document.getElementById("confOut"); if(o) o.textContent=v+" · "+CONF_LABELS[v]; }
});
function onAct(e){
  const el=e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const a=el.dataset.act;
  // las respuestas ya tienen su propio sonido (acierto o error); el resto de los botones hace un tic neutro
  if(!["pAnswer","sAnswer","sSubmit","toggle","saveProfile"].includes(a)) tick();
  if(a==="tab") setTab(el.dataset.tab);
  else if(a==="brand") setTab("inicio");
  else if(a==="list") go({tab:"practica", view:"list"},"left");
  else if(a==="open"){ S.sid=el.dataset.id||S.sid; const back=["practice","sim","results"].includes(S.view); go({tab:"practica", view:"scenario"}, back?"left":"right"); }
  else if(a==="openScen"){ S.sid=el.dataset.id; go({tab:"practica", view:"scenario"},"right"); }
  else if(a==="startPractice"){ if(el.dataset.id) S.sid=el.dataset.id; startPractice(); }
  else if(a==="startSim"){ if(el.dataset.id) S.sid=el.dataset.id; startSim(); }
  else if(a==="pAnswer"){
    const P=S.practice, q=P.qs[P.i], k=+el.dataset.k; P.answered=k;
    const ok=q.opts[k]===q.w.pro, cur=progress.words[q.w.id]||0;
    progress.words[q.w.id]= ok? Math.min(3,cur+1) : Math.max(0,cur-1);
    if(ok){ P.correct++; chime(); } else softMiss();
    markDay(); save(); render();
  }
  else if(a==="pNext"){
    const P=S.practice;
    if(P.i<P.qs.length-1){ P.i++; P.answered=null; S.anim="right"; render(); }
    else { S.practiceDone={sid:S.sid, correct:P.correct}; startSim(); }
  }
  else if(a==="speak"){ const s=scen(); speak(s.sim[S.sim.i].say); }
  else if(a==="mic"){ toggleMic(); }
  else if(a==="sAnswer"){
    const s=scen(), M=S.sim, t=s.sim[M.i], k=+el.dataset.k; M.answered=k;
    M.results[M.i] = t.type==="choice"
      ? {type:"choice", turn:M.i, S:t.opts[k].s, fb:t.opts[k].fb, text:t.opts[k].t}
      : {type:"fill", turn:M.i, S:k===0?1:0, fb:(k===0?"Correcto. ":"Lo adecuado era «"+t.opts[0]+"». ")+t.fb, text:t.tpl.replace("___", atSentenceStart(t.tpl)?cap(t.opts[k]):t.opts[k])};
    if(M.results[M.i].S>=1) chime(); else softMiss();
    markDay(); save(); render();
  }
  else if(a==="sSubmit"){
    const s=scen(), M=S.sim, t=s.sim[M.i], ta=document.getElementById("answer"), text=(ta.value||"").trim();
    if(rec){ try{rec.stop();}catch(err){} }
    if(!text){ document.getElementById("micStatus").textContent="Escribe o dicta una respuesta antes de evaluar."; return; }
    const r=scoreFree(t, text, S.voiceMeta, s.weights, s);
    M.results[M.i]=Object.assign(r,{type:"free", turn:M.i, text, model:t.model}); M.answered=0; S.voiceMeta=null;
    if(r.S>=.75) chime(); else if(r.S<.45) softMiss();
    markDay(); save(); render();
  }
  else if(a==="sNext"){
    const s=scen(), M=S.sim;
    if(M.i<s.sim.length-1){ M.i++; M.answered=null; S.voiceMeta=null; S.anim="right"; render(); if(progress.settings.autoSpeak) speak(s.sim[M.i].say); }
    else finishSim();
  }
  else if(a==="saveProfile") saveProfile();
  else if(a==="toggle"){
    const k=el.dataset.key; progress.settings[k]=!progress.settings[k]; save();
    try{ localStorage.removeItem("aura.sound"); }catch(err){}
    if(progress.settings[k] && (k==="sound"||k==="clicks")) chime();
    render();
  }
  else if(a==="resetAsk"){ S.confirm="reset"; render(); }
  else if(a==="wipeAsk"){ S.confirm="wipe"; render(); }
  else if(a==="cancelConfirm"){ S.confirm=null; render(); }
  else if(a==="resetYes"){ progress=freshProgress(progress); save(); S.confirm=null; S.toast="Progreso reiniciado."; S.practiceDone=null; S.view="list"; render(); }
  else if(a==="wipeYes"){ progress=freshProgress(); save(); try{ localStorage.removeItem("aura.sound"); }catch(err){} S={tab:"inicio", view:"list", anim:"up"}; render(); }
}
try{ if("speechSynthesis" in window) speechSynthesis.getVoices(); }catch(e){}
render();
</script>

</body>
</html>
