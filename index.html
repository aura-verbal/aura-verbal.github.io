<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aura</title>
<meta name="description" content="Entrena cómo suenas: vocabulario por contexto y simulaciones de conversación, adaptadas a tu país.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aura">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna pensada para celular, con barra inferior de 4 secciones.
   Identidad única: negro y dorado en cualquier tema del sistema. */
:root{
  --bg:#0a0a0b; --surface:#131210; --surface-2:#1c1a16; --line:#2f2a20;
  --fg:#f4eee0; --muted:#a69f8c;
  --accent:#d4af37; --accent-ink:#0a0a0b; --gold-dark:#8f6b1e; --gold-light:#f6e09a;
  --good:#8cc79a; --bad:#e08a6b; --good-soft:rgba(140,199,154,.12); --bad-soft:rgba(224,138,107,.12); --accent-soft:rgba(212,175,55,.12);
  --font-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --nav-h:68px; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px))}
body.onboarding .wrap{padding-block-end:calc(40px + env(safe-area-inset-bottom, 0px))}
body.onboarding .nav{display:none}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em;color:var(--fg)}
h1{font-size:clamp(2rem,6vw,2.75rem);font-weight:800;line-height:1.05}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:1.5rem;font-weight:700;line-height:1.15}
h3{font-size:1.125rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.lead{color:var(--muted);max-width:46ch;margin-top:10px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.35rem;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;color:var(--fg)}
.brand small{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.mark{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.95rem;color:var(--accent);border:2px solid var(--accent);box-shadow:0 0 12px rgba(212,175,55,.35), inset 0 0 6px rgba(212,175,55,.15)}
.pill{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--accent);border:1px solid var(--line);white-space:nowrap}

/* Bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:700;position:relative;letter-spacing:.02em}
.nav button svg{width:22px;height:22px;transition:transform .25s ease}
.nav button.on{color:var(--accent)}
.nav button.on svg{transform:translateY(-1px) scale(1.08)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 2px 2px;background:var(--accent);box-shadow:0 0 10px rgba(212,175,55,.6)}

/* Page transitions */
.view.anim-up{animation:enterUp .34s cubic-bezier(.2,.8,.2,1) both}
.view.anim-right{animation:enterRight .34s cubic-bezier(.2,.8,.2,1) both}
.view.anim-left{animation:enterLeft .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes enterUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes enterRight{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes enterLeft{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.section{padding-top:20px;display:flex;flex-direction:column;gap:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,var(--gold-light) -40%,var(--accent) 55%,var(--gold-dark) 160%);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 50%, var(--line))}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;align-self:flex-start}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* Hero photo */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:12px}
.photo{position:relative;margin:0;border-radius:18px;overflow:hidden;aspect-ratio:3/2;max-width:100%;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.photo.sm{aspect-ratio:16/9}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;animation:settle 1.6s cubic-bezier(.2,.8,.2,1) both}
.photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 50%,var(--bg) 100%),radial-gradient(ellipse at 50% 40%,transparent 60%,rgba(10,10,11,.5) 100%)}
@keyframes settle{from{transform:scale(1.06);opacity:.6}to{transform:none;opacity:1}}
.hero h1.over{margin-top:-52px;position:relative;z-index:1;padding:0 4px}
.hero .lead{padding:0 4px}

/* Cards */
.greet{display:flex;align-items:center;gap:14px;padding-top:22px}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--accent);border:2px solid var(--accent);background:var(--surface);box-shadow:0 0 18px rgba(212,175,55,.25)}
.avatar.sm{width:42px;height:42px;font-size:1rem;box-shadow:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
button.card:hover{border-color:var(--accent)}
.card.feature{border-color:color-mix(in srgb, var(--accent) 45%, var(--line));background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 9%, var(--surface)), var(--surface) 60%)}
.card .meta{font-size:.88rem;color:var(--muted)}
.card-head{display:flex;align-items:center;gap:12px;min-width:0}
.s-icon{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb, var(--accent) 30%, transparent)}
.s-icon svg{width:22px;height:22px}
.cta{color:var(--accent);font-weight:700;font-size:.92rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);align-self:flex-start}
.tag.quiet{background:var(--surface-2);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold-dark),var(--accent),var(--gold-light));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.barlabel{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));background:var(--accent-soft);font-size:.92rem}
.banner .flag{font-size:1.5rem;line-height:1}
.banner p{flex:1;min-width:0}
.banner .x{background:none;border:0;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px;min-width:0;border:1px solid var(--line)}
.kpi b{font-family:var(--font-mono);font-size:1.2rem;display:block;color:var(--fg);font-variant-numeric:tabular-nums}
.kpi span{font-size:.76rem;color:var(--muted)}
.kpi .delta{font-size:.78rem}

/* Ring */
.ring{--p:0;--size:120px;width:var(--size);height:var(--size);border-radius:50%;position:relative;display:grid;place-items:center;flex:none;
  background:conic-gradient(from 210deg, var(--gold-dark) 0, var(--accent) calc(var(--p)*.5%), var(--gold-light) calc(var(--p)*1%), var(--surface-2) calc(var(--p)*1%));}
.ring::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle, rgba(212,175,55,.28) 0, transparent 70%);opacity:calc(.25 + var(--p)/140);z-index:-1}
.ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;z-index:1;text-align:center;line-height:1.1}
.ring b{font-family:var(--font-display);font-size:1.8rem;font-weight:800;display:block}
.ring small{font-size:.7rem;color:var(--muted)}
.ring-row{display:flex;align-items:center;gap:20px;padding-top:22px}

/* Countries */
.paises{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.paises{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pais{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:54px;min-width:0}
.pais:hover{border-color:var(--muted)}
.pais .flag{font-size:1.45rem;line-height:1;flex:none}
.pais .pn{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.pais .pn b{font-size:.92rem}
.pais .pn small{font-size:.72rem;color:var(--muted)}
.pais.on{border-color:var(--accent);background:var(--accent-soft)}

/* Library */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:700;color:var(--muted)}
.fchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.soon{display:flex;flex-direction:column;gap:6px}
.soon-row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:.9rem}
.soon-row span:last-child{font-size:.75rem;white-space:nowrap}

/* Ficha */
.ficha{display:grid;gap:14px;margin:0}
.ficha dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
.ficha dd{margin:3px 0 0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:9px;font-weight:700;color:var(--muted);min-height:42px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* Stepper */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;min-width:0}
.step .n{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
.step b{display:block;font-size:.95rem}
.step.on{border-color:var(--accent);background:var(--accent-soft)}

/* Vocab */
.vocab{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vrow .from{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--bad) 60%, transparent)}
.vrow .to{font-weight:700}
.vrow .alt{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.arrow{color:var(--accent);font-family:var(--font-mono)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.vhead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto;gap:10px;padding:0 14px}
@media (max-width:480px){.vrow,.vhead{grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr)}.vrow .dots,.vhead .dh{display:none}}
.crit{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.92rem}

/* Question / chat */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);min-height:44px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--good-soft);border-left:3px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:3px solid var(--bad)}
.fb.mid{background:var(--accent-soft);border-left:3px solid var(--accent)}
.blank{display:inline-block;min-width:4ch;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;color:var(--fg)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
textarea{width:100%;min-height:110px;resize:vertical;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hint{font-size:.88rem;color:var(--muted)}
.hint b{color:var(--fg)}
.note{font-size:.85rem;color:var(--muted)}
.dotsprog{display:flex;gap:6px}
.dotsprog i{flex:1;height:4px;border-radius:99px;background:var(--surface-2)}
.dotsprog i.done{background:var(--accent)}

/* Simulation */
.sim-head{display:flex;align-items:center;gap:12px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 59px);z-index:4;background:var(--bg);padding-block:10px;margin-block:-10px}
.meter{flex:1;min-width:0}
.meter-top{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.meter-top b{color:var(--fg)}
.meter-bar{position:relative;height:10px;border-radius:99px;background:var(--surface-2);margin-top:6px;border:1px solid var(--line)}
.meter-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--gold-dark),var(--accent),var(--gold-light));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.meter-bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted);opacity:.5}
.chat{display:flex;flex-direction:column;gap:10px}
#turnoActual{scroll-margin-top:140px}
.msg{max-width:88%;padding:10px 14px;font-size:.95rem;min-width:0}
.msg.them{align-self:flex-start;background:var(--surface-2);border-radius:4px 14px 14px 14px}
.msg.me{align-self:flex-end;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:14px 4px 14px 14px}
.msg .who{font-size:.74rem;color:var(--muted);font-weight:700;margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.say-row{display:flex;gap:10px;align-items:flex-start}
.say-row .msg{flex:1;max-width:none}
.dchip{font-family:var(--font-mono);font-size:.76rem;font-weight:500;padding:1px 7px;border-radius:99px;white-space:nowrap}
.dchip.up{color:var(--good);background:var(--good-soft)}
.dchip.down{color:var(--bad);background:var(--bad-soft)}
.dchip.flat{color:var(--muted);background:var(--surface-2)}
.escuchate{border:1px dashed color-mix(in srgb, var(--accent) 40%, var(--line));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.escuchate audio{width:100%;height:40px}
.rec-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* Results */
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-family:var(--font-display);font-size:3.5rem;font-weight:800;line-height:1}
.ending{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 0}
.medal{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--accent);box-shadow:0 0 28px rgba(212,175,55,.35), inset 0 0 12px rgba(212,175,55,.2);font-family:var(--font-display);font-weight:700;font-size:1.9rem;color:var(--accent)}
.ending.medio .medal{border-color:var(--gold-dark);color:var(--gold-dark);box-shadow:none}
.ending.bajo .medal{border-color:var(--line);color:var(--muted);box-shadow:none}
.turn{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.turn:first-of-type{border-top:0;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip.no{border-color:var(--bad);color:var(--bad)}
.delta{font-family:var(--font-mono);color:var(--good);font-size:.9rem}
.delta.neg{color:var(--bad)}
.recs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:12px;background:var(--bad-soft)}
.share-img{width:100%;max-width:240px;border-radius:14px;border:1px solid var(--line);align-self:center;display:block}

/* Baseline test */
.rec-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.rec-btn{--p:0;width:132px;height:132px;border-radius:50%;border:0;position:relative;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-2) 0)}
.rec-btn::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.rec-btn span{position:relative;z-index:1;display:grid;place-items:center;gap:2px;color:var(--accent)}
.rec-btn span svg{width:34px;height:34px}
.rec-btn span b{font-family:var(--font-mono);font-size:1.6rem;color:var(--fg)}
.rec-btn.live::after{background:color-mix(in srgb, var(--bad) 14%, var(--surface))}
.transcript{min-height:72px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.95rem;color:var(--fg)}
.transcript:empty::before{content:"Aquí aparecerá lo que digas...";color:var(--muted)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:.85rem;font-weight:700;color:var(--fg)}
input[type="text"],input[type="date"]{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
input[type="text"]:focus,input[type="date"]:focus{border-color:var(--accent);outline:none}
input[type="range"]{width:100%;accent-color:var(--accent)}
.chips-opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:400px){.chips-opt{grid-template-columns:1fr}}
.chip-opt{position:relative}
.chip-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip-opt span{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:.9rem;min-height:44px}
.chip-opt svg{width:18px;height:18px;flex:none}
.chip-opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.chip-opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.conf-out{font-size:.85rem;color:var(--accent);font-weight:700}
.err{color:var(--bad);font-size:.85rem;min-height:1em}
.toast{padding:10px 14px;border-radius:12px;background:var(--good-soft);border-left:3px solid var(--good);font-size:.92rem}

/* Settings */
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting p{font-size:.95rem}
.setting small{display:block;color:var(--muted);font-size:.8rem}
.switch{width:50px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);position:relative;flex:none;padding:0;transition:background .2s}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .22s cubic-bezier(.2,.8,.2,1), background .2s}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] .knob{transform:translateX(20px);background:var(--accent)}
.switch[disabled]{opacity:.4;cursor:not-allowed}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--font-mono);font-size:10px}
.chart .val{fill:var(--fg);font-family:var(--font-mono);font-size:11px}
.chart .b{fill:var(--accent)}
.chart .b:hover{fill:var(--gold-light)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.92rem;text-align:center}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.srow .s-icon{width:36px;height:36px}
.loading{display:grid;place-items:center;padding:80px 0;color:var(--muted)}
.loading .mark{width:52px;height:52px;font-size:1.4rem;animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* reto diario */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wd i{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:.85rem;font-weight:700;color:var(--accent-ink)}
.wd.on i{background:var(--accent);border-color:var(--accent)}
.wd.prac i{color:var(--accent);font-size:1.2rem;border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.wd.today i{outline:2px solid var(--accent);outline-offset:2px}
.wd small{font-size:.72rem;color:var(--muted)}
.wd.today small{color:var(--accent);font-weight:700}
.card.reto.done{border-color:color-mix(in srgb, var(--good) 35%, var(--line))}
.card.reto.done:hover{border-color:color-mix(in srgb, var(--good) 35%, var(--line))}
.card.reto.done .s-icon{color:var(--good)}
.prep-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.chips-opt.compact{grid-template-columns:repeat(4,minmax(0,1fr))}
.chips-opt.compact span{justify-content:center;padding:10px 6px}
.prep-sum .eyebrow{flex-basis:100%}
.prep-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.panel.prep{border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
.card.evento{border-color:color-mix(in srgb, var(--accent) 55%, var(--line))}
.frase{font-weight:500;font-family:var(--font-body);font-size:1.15rem}
</style>
</head>
