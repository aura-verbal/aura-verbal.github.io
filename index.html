<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="description" content="Entrena cómo suenas: vocabulario por contexto y simulaciones de conversación.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aura">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Aura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una sola columna centrada (app de práctica, pensada primero para celular), con el anillo dorado de la marca como único gesto visual fuerte.
   Identidad deliberadamente única: negro y dorado en cualquier tema del sistema. */
:root{
  --bg:#0a0a0b; --surface:#131210; --surface-2:#1c1a16; --line:#2f2a20;
  --fg:#f4eee0; --muted:#a69f8c;
  --accent:#d4af37; --accent-ink:#0a0a0b; --gold-dark:#8f6b1e; --gold-light:#f6e09a;
  --good:#8cc79a; --bad:#e08a6b; --good-soft:rgba(140,199,154,.12); --bad-soft:rgba(224,138,107,.12); --accent-soft:rgba(212,175,55,.12);
  --font-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,2.75rem);font-weight:800;line-height:1.05}
h2{font-size:1.5rem;font-weight:700;line-height:1.15}
h3{font-size:1.125rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.35rem;background:none;border:0;padding:0;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.brand{align-items:center;color:var(--fg)}
.mark{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.95rem;color:var(--accent);
  border:2px solid var(--accent);box-shadow:0 0 12px rgba(212,175,55,.35), inset 0 0 6px rgba(212,175,55,.15)}
h1,h2{color:var(--fg)}
h1 em{font-style:normal;color:var(--accent)}
.pill{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.top-right{display:flex;align-items:center;gap:8px}
.sound-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:inline-grid;place-items:center;padding:0}
.sound-btn svg{width:18px;height:18px}
.sound-btn[aria-pressed="false"]{color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(180deg,var(--gold-light) -40%,var(--accent) 55%,var(--gold-dark) 160%);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700}

/* Hero + aura ring */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding-block:28px 20px}
.hero p{margin-top:10px;max-width:42ch;color:var(--muted)}
.ring{--p:0;--size:128px;width:var(--size);height:var(--size);border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(from 210deg, var(--gold-dark) 0, var(--accent) calc(var(--p)*.5%), var(--gold-light) calc(var(--p)*1%), var(--surface-2) calc(var(--p)*1%));}
.ring::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--accent) 28%, transparent) 0, transparent 70%);opacity:calc(.25 + var(--p)/140);z-index:-1}
.ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;z-index:1;text-align:center;line-height:1.1}
.ring b{font-family:var(--font-display);font-size:1.9rem;font-weight:800;display:block}
.ring small{font-size:.72rem;color:var(--muted)}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero .ring{--size:112px}}

/* Scenario cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
button.card:hover{border-color:var(--accent)}
.card .meta{font-size:.85rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold-dark),var(--accent),var(--gold-light));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.barlabel{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}

/* Stepper (secuencia real: vocabulario → práctica → simulación) */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block:16px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;min-width:0}
.step .n{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
.step b{display:block;font-size:.95rem}
.step.on{border-color:var(--accent);background:var(--accent-soft)}

/* Vocab list */
.vocab{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vrow .from{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--bad) 60%, transparent)}
.vrow .to{font-weight:700}
.vrow .alt{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.arrow{color:var(--accent);font-family:var(--font-mono)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.vhead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto;gap:10px;padding:0 14px}
@media (max-width:480px){.vrow,.vhead{grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr)}.vrow .dots,.vhead .dh{display:none}}
.crit{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.92rem}

/* Question / chat */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);min-height:44px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--good-soft);border-left:3px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:3px solid var(--bad)}
.fb.mid{background:var(--accent-soft);border-left:3px solid var(--accent)}
.blank{display:inline-block;min-width:4ch;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700}
.say{display:flex;gap:10px;align-items:flex-start}
.bubble{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:12px 14px;flex:1;min-width:0}
.bubble .who{font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:2px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
textarea{width:100%;min-height:110px;resize:vertical;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hint{font-size:.88rem;color:var(--muted)}
.hint b{color:var(--fg)}
.note{font-size:.85rem;color:var(--muted)}
.dotsprog{display:flex;gap:6px}
.dotsprog i{flex:1;height:4px;border-radius:99px;background:var(--surface-2)}
.dotsprog i.done{background:var(--accent)}

/* Results */
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-family:var(--font-display);font-size:3.5rem;font-weight:800;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{font-family:var(--font-mono);font-size:1.15rem;display:block}
.kpi span{font-size:.78rem;color:var(--muted)}
.turn{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.turn:first-child{border-top:0;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip.no{border-color:var(--bad);color:var(--bad)}
.delta{font-family:var(--font-mono);color:var(--good);font-size:.9rem}
.recs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.stack{display:flex;flex-direction:column;gap:16px}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.82rem}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" data-act="home" aria-label="Ir al inicio"><span class="mark" aria-hidden="true">Aa</span>Aura <small>confianza verbal</small></button>
  <div class="top-right"><button class="sound-btn" id="soundBtn" data-act="sound" aria-pressed="true" aria-label="Sonido activado"></button><span class="pill mono" id="globalPill">0%</span></div>
</div></header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ===================== CONTENIDO (borrador v1 para revisión) ===================== */
const SCENARIOS = [
{
  id:"presentacion", name:"Presentación en la universidad", short:"una presentación de proyecto",
  who:"Profesora (comisión)", blurb:"Expón tu proyecto y responde preguntas de la comisión.",
  labels:["Coloquial","Profesional"],
  crit:"Se evalúa precisión del vocabulario, estructura y pocas muletillas. Formal, pero sin sonar rebuscado.",
  weights:{v:.6,m:.25,p:.15},
  words:[
    {col:"cosas", pro:"aspectos", alt:"puntos, elementos", why:"«Cosas» es vago; «aspectos» anuncia que hay una estructura.", ex:"Hoy les voy a presentar tres ___ clave del proyecto.", d:["cositas","menesteres"], det:["cosas"]},
    {col:"hicimos", pro:"desarrollamos", alt:"elaboramos, implementamos", why:"Describe el trabajo con el verbo que corresponde a un proyecto.", ex:"Para resolverlo, ___ un modelo de optimización en Python.", d:["armamos","perpetramos"], det:["hicimos"]},
    {col:"más o menos", pro:"aproximadamente", alt:"cerca de, alrededor de", why:"Da una cifra estimada sin sonar inseguro.", ex:"El costo de despacho baja ___ un 15%.", d:["tipo","a ojo de buen cubero"], det:["mas o menos"]},
    {col:"se nota que", pro:"se observa que", alt:"los datos muestran que", why:"Apoya la afirmación en la evidencia, no en una impresión.", ex:"En el gráfico ___ la demanda sube en diciembre.", d:["se cacha que","se ve clarito que"], det:["se nota"]},
    {col:"fallas", pro:"limitaciones", alt:"restricciones", why:"Reconoce los límites del trabajo sin descalificarlo.", ex:"Una de las ___ del modelo es que no considera la estacionalidad.", d:["errorcillos","flaquezas"], det:["fallas"]},
    {col:"mostrar", pro:"exponer", alt:"presentar", why:"Es el verbo propio de una presentación académica.", ex:"A continuación voy a ___ los resultados.", d:["enseñar","explayar"], det:[]},
    {col:"por eso", pro:"por lo tanto", alt:"en consecuencia, por ende", why:"Conecta causa y efecto de forma explícita.", ex:"El costo de transporte bajó; ___, el margen aumentó.", d:["entonces po","ergo"], det:["por eso"]},
    {col:"súper importante", pro:"fundamental", alt:"crucial, determinante", why:"Una palabra precisa pesa más que un intensificador.", ex:"Validar los datos fue ___ para el resultado.", d:["importantísimo a full","de suma trascendencia sideral"], det:["super importante","muy importante"]},
    {col:"y eso sería", pro:"en síntesis", alt:"para concluir, en resumen", why:"Señala el cierre y deja la idea principal al final.", ex:"___, el proyecto reduce los tiempos de despacho en un 15%.", d:["y eso sería","a modo de colofón final"], det:["y eso seria"]},
    {col:"no sé", pro:"no cuento con ese dato", alt:"lo verifico y le respondo", why:"Admite que no sabes algo sin perder credibilidad.", ex:"Buena pregunta: ___ en este momento, pero lo verifico.", d:["ni idea","lo desconozco absolutamente"], det:["ni idea"]}
  ],
  sim:[
    {type:"choice", say:"Adelante, tiene cinco minutos. ¿De qué trata su proyecto?", opts:[
      {t:"Hoy les presentaré los tres aspectos clave de nuestro proyecto: el problema, el modelo que desarrollamos y los resultados.", s:1, fb:"Estructura clara y vocabulario preciso (aspectos, desarrollamos)."},
      {t:"Eh, bueno, hicimos un proyecto sobre unas cosas de logística, igual quedó bueno.", s:.3, fb:"Inicio con muletillas («eh, bueno») y palabras vagas («cosas», «igual»)."},
      {t:"Me permito exponer ante tan distinguida comisión la sinopsis de nuestra magna investigación.", s:.4, fb:"Exceso de formalidad: suena impostado. Hablar con propiedad no es hablar difícil."}]},
    {type:"choice", say:"¿Cuánto mejora el indicador con su propuesta?", opts:[
      {t:"Como un quince por ciento, más o menos. Se nota harto.", s:.3, fb:"La cifra está, pero «más o menos» y «se nota» le restan seguridad."},
      {t:"El tiempo de despacho baja aproximadamente un 15%, como se observa en el gráfico.", s:1, fb:"Cifra, precisión y evidencia en una sola frase."},
      {t:"La mejora es súper importante, no tengo el número exacto pero es harta.", s:.2, fb:"Sin dato concreto la afirmación pierde fuerza."}]},
    {type:"fill", say:"¿Qué limitaciones tiene su modelo?", tpl:"Una de las ___ del modelo es que no considera la estacionalidad; por lo tanto, proponemos ampliarlo.", opts:["limitaciones","fallas","flaquezas"], fb:"«Limitaciones» reconoce el límite sin desacreditar tu trabajo."},
    {type:"free", say:"¿Por qué eligieron ese método y no otro?", hint:["desarrollamos","por lo tanto","fundamental"],
      groups:[["desarroll","elabor","implement"],["por lo tanto","en consecuencia","por ende"],["fundamental","crucial","determinant","relevant"]],
      model:"Desarrollamos un modelo de optimización porque los datos lo permitían; por lo tanto, fue fundamental validar los supuestos antes de aplicarlo."},
    {type:"free", say:"Muy bien. Cierre su presentación, por favor.", hint:["en síntesis","aspectos","exponer"],
      groups:[["en sintesis","para concluir","en resumen"],["aspecto","punto","element"],["expus","expon","present"]],
      model:"En síntesis, expusimos los tres aspectos clave del proyecto: el problema, el modelo y los resultados. Muchas gracias."}
  ]
},
{
  id:"entrevista", name:"Entrevista de trabajo", short:"una entrevista de trabajo",
  who:"Reclutadora", blurb:"Responde las preguntas típicas de una primera entrevista.",
  labels:["Coloquial","Profesional"],
  crit:"Se evalúa claridad, logros concretos y seguridad sin sobrevenderte.",
  weights:{v:.6,m:.25,p:.15},
  words:[
    {col:"arreglar", pro:"resolver", alt:"solucionar", why:"Muestra que enfrentas problemas, no solo que los parchas.", ex:"En mi trabajo anterior tuve que ___ un quiebre de stock en plena temporada.", d:["parchar","subsanar ingentemente"], det:["arregl"]},
    {col:"cosas que hacía", pro:"responsabilidades", alt:"funciones, tareas", why:"Así se describen los cargos en un CV y en una entrevista.", ex:"Entre mis ___ estaba el control de inventario.", d:["pegas","menesteres"], det:["cosas","pegas"]},
    {col:"soy bueno para", pro:"tengo experiencia en", alt:"me desempeño bien en", why:"Lo respalda la experiencia, no la autoevaluación.", ex:"___ análisis de datos con Excel y Python.", d:["soy seco para","soy un experto absoluto en"], det:["soy bueno","soy buena","soy seco","soy seca"]},
    {col:"trabajar con otros", pro:"colaborar", alt:"coordinarme", why:"Es la competencia que buscan los reclutadores, dicha con su nombre.", ex:"Me gusta ___ con otras áreas para cumplir los plazos.", d:["hacer pega con otros","sinergizar"], det:[]},
    {col:"cacho rápido", pro:"aprendo con rapidez", alt:"me adapto con facilidad", why:"Transmite la misma idea con un tono adecuado al contexto.", ex:"___ nuevos sistemas; en un mes ya manejaba el WMS.", d:["pesco al toque","asimilo cognitivamente"], det:["cacho"]},
    {col:"me fue bien", pro:"logré", alt:"conseguí", why:"Atribuye el resultado a tu acción y abre paso a una cifra.", ex:"___ reducir los errores de picking en un 20%.", d:["me salió","acometí exitosamente"], det:["me fue bien"]},
    {col:"lo malo mío es", pro:"un aspecto que estoy mejorando es", alt:"un área de mejora es", why:"Reconoce una debilidad y muestra que trabajas en ella.", ex:"___ la delegación de tareas.", d:["mi peor defecto es","no tengo debilidades, pero"], det:["lo malo"]},
    {col:"la plata", pro:"renta", alt:"remuneración", why:"Término habitual en Chile para hablar de sueldo en una entrevista.", ex:"¿Cuál es la ___ asociada al cargo?", d:["luca","emolumento"], det:["plata","lucas"]},
    {col:"me tinca", pro:"me interesa", alt:"me motiva", why:"Expresa interés con una razón concreta detrás.", ex:"___ este cargo porque combina logística y análisis.", d:["me tinca","me apasiona locamente"], det:["me tinca"]},
    {col:"harto", pro:"considerablemente", alt:"de forma significativa", why:"Prepara el terreno para dar una cifra.", ex:"Con ese cambio, el tiempo de respuesta mejoró ___.", d:["caleta","ostensiblemente"], det:["harto","caleta"]}
  ],
  sim:[
    {type:"choice", say:"Cuéntame un poco de ti.", opts:[
      {t:"Soy estudiante de ingeniería y tengo experiencia en gestión de inventario; entre mis responsabilidades estaba el control de stock.", s:1, fb:"Breve, concreto y con experiencia verificable."},
      {t:"Eh, nada, soy seco para Excel y me tinca harto la pega.", s:.3, fb:"Muy coloquial para una primera entrevista y sin un dato concreto."},
      {t:"Soy un profesional excepcional y no tengo debilidades conocidas.", s:.2, fb:"Sobrevenderte genera desconfianza."}]},
    {type:"choice", say:"¿Por qué te interesa este cargo?", opts:[
      {t:"Porque me tinca y la plata está buena.", s:.1, fb:"Honesto, pero comunica solo interés económico."},

/*LOGIC-START*/
const MUL_PHRASES = ["o sea","como que","como onda","es que nada"];
const MUL_TOKENS = ["osea","cachai","cachay","eh","ehh","ehhh","em","emm","mm","mmm","po","literal","basicamente"];
const PPM_RANGE = [110,160];

function norm(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[¿?¡!.,;:"“”«»()\[\]…]/g," ").replace(/\s+/g," ").trim();
}
function tokens(s){ const n=norm(s); return n? n.split(" "):[]; }
function hasStem(text, stem){
  const n=" "+norm(text)+" ", st=norm(stem);
  if(st.includes(" ")||st.includes("-")) return n.includes(" "+st);
  return tokens(text).some(t=>t.startsWith(st));
}
function countMuletillas(text){
  const n=" "+norm(text)+" ", toks=tokens(text), found={}; let count=0;
  MUL_PHRASES.forEach(p=>{ const re=new RegExp(" "+p+"(?= )","g"); const m=n.match(re); if(m){found[p]=(found[p]||0)+m.length; count+=m.length;} });
  toks.forEach((t,i)=>{
    let hit = MUL_TOKENS.includes(t);
    if(t==="tipo" && !["de","del"].includes(toks[i+1])) hit=true;
    if(hit){found[t]=(found[t]||0)+1; count++;}
  });
  return {count, found};
}
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function paceScore(ppm){
  if(ppm>=PPM_RANGE[0] && ppm<=PPM_RANGE[1]) return 1;
  return ppm<PPM_RANGE[0] ? clamp01((ppm-60)/(PPM_RANGE[0]-60)) : clamp01((220-ppm)/(220-PPM_RANGE[1]));
}
/* S = w1·vocab + w2·(1 − min(1, muletillas/umbral)) + w3·f(PPM)  — sin voz, se omite el ritmo y se renormaliza */
function scoreFree(turn, text, meta, weights, scen){
  const matched=[], missing=[];
  turn.groups.forEach((g,i)=>{ (g.some(st=>hasStem(text,st)) ? matched : missing).push(turn.hint[i]||g[0]); });
  const v = turn.groups.length ? matched.length/turn.groups.length : 0;
  const mul = countMuletillas(text);
  const nWords = tokens(text).length;
  let m, ppm=null, p=null;
  const voice = meta && meta.voice && meta.seconds && meta.seconds>=3;
  if(voice){ const tm = mul.count/(meta.seconds/60); m = 1-Math.min(1, tm/4); ppm = nWords/(meta.seconds/60); p = paceScore(ppm); }
  else { m = 1-Math.min(1, mul.count/3); }
  let S = voice ? (weights.v*v + weights.m*m + weights.p*p) : (weights.v*v + weights.m*m)/(weights.v+weights.m);
  const notes=[];
  if(nWords<5){ S=Math.min(S,.5); notes.push("Respuesta muy corta: intenta desarrollar la idea en una o dos frases."); }
  const colloquial=[];
  if(scen) scen.words.forEach(w=>{ (w.det||[]).forEach(d=>{ if(hasStem(text,d) && !colloquial.find(c=>c.col===w.col)) colloquial.push({col:w.col, pro:w.pro}); }); });
  return {S:clamp01(S), v, m, p, ppm, nWords, mul, matched, missing, colloquial, notes, voice:!!voice};
}
function emptyProgress(){ return {words:{}, sims:{}}; }
function scenarioProgress(prog, scen){
  const boxes = scen.words.map(w=>Math.min(3, prog.words[w.id]||0)/3);
  const mastery = boxes.reduce((a,b)=>a+b,0)/boxes.length;
  const best = (prog.sims[scen.id] && prog.sims[scen.id].best)||0;
  return Math.round((0.6*mastery + 0.4*best/100)*100);
}
function globalProgress(prog, scens){ return Math.round(scens.reduce((a,s)=>a+scenarioProgress(prog,s),0)/scens.length); }
/*LOGIC-END*/

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function tone(freq, start, dur, vol){
  const o=actx.createOscillator(), g=actx.createGain(), o2=actx.createOscillator(), g2=actx.createGain();
  o.type="sine"; o.frequency.value=freq; o2.type="sine"; o2.frequency.value=freq*2.01;
  [[g,vol],[g2,vol*.22]].forEach(([gn,v])=>{ gn.gain.setValueAtTime(0.0001,start); gn.gain.exponentialRampToValueAtTime(v,start+0.012); gn.gain.exponentialRampToValueAtTime(0.0001,start+dur); });
  o.connect(g).connect(actx.destination); o2.connect(g2).connect(actx.destination);
  o.start(start); o2.start(start); o.stop(start+dur+0.05); o2.stop(start+dur+0.05);
}
function playNotes(notes){
  if(!SOUND_ON) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx=actx||new AC(); if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime+0.02;
    notes.forEach(([f,dt,dur])=>tone(f,t+dt,dur,0.16));
  }catch(e){}
}

/* ===================== VOZ (Web Speech API, gratis en el navegador) ===================== */
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const voices=speechSynthesis.getVoices();
    const pick=["es-CL","es-419","es-US","es-MX","es-ES"].map(l=>voices.find(v=>v.lang&&v.lang.replace("_","-").startsWith(l))).find(Boolean) || voices.find(v=>v.lang&&v.lang.startsWith("es"));
    if(pick){u.voice=pick; u.lang=pick.lang;} else u.lang="es-CL";
    u.rate=1; speechSynthesis.speak(u);
  }catch(e){}
}
let rec=null;
function toggleMic(){
  const ta=document.getElementById("answer"), btn=document.getElementById("micBtn"), st=document.getElementById("micStatus");
  if(rec){ try{rec.stop();}catch(e){} return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ st.textContent="Tu navegador no reconoce voz. Escribe tu respuesta (en Chrome sí funciona)."; return; }
  let base=ta.value.trim(), finalText="", t0=null, t1=null;
  try{
    rec=new SR(); rec.lang="es-CL"; rec.continuous=true; rec.interimResults=true;
    rec.onresult=e=>{
      const now=performance.now(); if(t0===null) t0=now;
      let interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal){ finalText+=r[0].transcript+" "; t1=now; } else interim+=r[0].transcript; }
      ta.value=(base?base+" ":"")+(finalText+interim).trim();
    };
    rec.onerror=e=>{
      st.textContent = e.error==="not-allowed"||e.error==="service-not-allowed"
        ? "El micrófono no está disponible en esta vista. Escribe tu respuesta; en la versión publicada en Chrome la voz sí funciona."
        : "No se pudo reconocer la voz ("+e.error+"). Intenta de nuevo o escribe.";
    };
    rec.onend=()=>{
      rec=null; btn.classList.remove("rec"); btn.setAttribute("aria-pressed","false");
      if(finalText.trim()){ S.voiceMeta={voice:true, seconds: t0!==null&&t1!==null ? (t1-t0)/1000 + 1 : null}; st.textContent="Listo. Revisa el texto y envía."; }
    };
    rec.start(); btn.classList.add("rec"); btn.setAttribute("aria-pressed","true"); st.textContent="Escuchando... toca de nuevo para terminar.";
  }catch(e){ rec=null; st.textContent="No se pudo iniciar el micrófono. Escribe tu respuesta."; }
}

      <div class="ring" style="--p:${g}" role="img" aria-label="Progreso total ${g}%"><span><b class="mono">${g}%</b><small>progreso total</small></span></div>
    </section>
    <section class="stack"><p class="eyebrow">Elige un escenario</p><div class="grid">${cards}</div></section>
    <div class="foot">
      <p>Voz: el reconocimiento funciona en Chrome. Si no está disponible, puedes responder escribiendo.</p>
      <p>Tu progreso se guarda solo en este navegador.</p>
      ${S.confirmReset ? `<div class="confirm"><span>¿Borrar todo el progreso?</span><button class="btn" data-act="resetYes">Sí, borrar</button><button class="btn ghost" data-act="resetNo">Cancelar</button></div>` : `<button class="linkish" data-act="reset">Reiniciar progreso</button>`}
    </div>`;
}

function stepper(active){
  const st=[["1","Vocabulario","scenario"],["2","Práctica","practice"],["3","Simulación","sim"]];
  return `<div class="steps">${st.map(([n,l,a])=>`<button class="step ${a===active?"on":""}" data-act="${a==="scenario"?"open":a==="practice"?"startPractice":"startSim"}" data-id="${S.sid}"><span class="n">Paso ${n}</span><b>${l}</b></button>`).join("")}</div>`;
}

function vScenario(){
  const s=scen();
  const rows=s.words.map(w=>{ const b=Math.min(3,progress.words[w.id]||0);
    return `<div class="vrow"><span class="from">${esc(w.col)}</span><span class="arrow">→</span><span class="to">${esc(w.pro)}<span class="alt">también: ${esc(w.alt)}</span></span><span class="dots" title="${b} de 3 aciertos">${[0,1,2].map(i=>`<i class="${i<b?"on":""}"></i>`).join("")}</span></div>`;}).join("");
  return `<button class="back" data-act="home">← Escenarios</button>
    <p class="eyebrow" style="margin-top:8px">${esc(s.who)}</p>
    <h2>${esc(s.name)}</h2>
    ${stepper("scenario")}
    <div class="stack">
      <p class="crit">${esc(s.crit)}</p>
      <div class="vhead eyebrow"><span>${esc(s.labels[0])}</span><span></span><span>${esc(s.labels[1])}</span><span class="dh">Dominio</span></div>
      <div class="vocab">${rows}</div>
      <p class="note">Una palabra queda dominada con 3 aciertos. Cada error resta uno.</p>
      <div class="row"><button class="btn primary" data-act="startPractice">Empezar práctica</button><button class="btn" data-act="startSim">Ir a la simulación</button></div>
    </div>`;
}

function startPractice(){
  const s=scen();
  const qs=shuffle(s.words).map((w,i)=>({w, kind: i%2===0?"context":"fill", opts: shuffle([w.pro, ...w.d])}));
  S.practice={qs, i:0, answered:null, correct:0};
  S.view="practice"; render();
}
function vPractice(){
  const s=scen(), P=S.practice, q=P.qs[P.i], w=q.w;
  const start = q.kind==="fill" && atSentenceStart(w.ex);
  const optsHTML=q.opts.map((o,k)=>{
    let cls="opt"; if(P.answered!==null){ if(o===w.pro) cls+=" ok"; else if(k===P.answered) cls+=" no"; }
    return `<button class="${cls}" data-act="pAnswer" data-k="${k}" ${P.answered!==null?"disabled":""}>${esc(start?cap(o):o)}</button>`;}).join("");
  const prompt = q.kind==="context"
    ? `<p class="hint">En ${esc(s.short)}, ¿qué usarías en lugar de…</p><h2>«${esc(w.col)}»</h2>`
    : `<p class="hint">Completa la frase con la opción más adecuada:</p><h3 style="font-weight:500;font-family:var(--font-body);font-size:1.15rem">${fillHTML(w.ex, P.answered!==null? (start?cap(w.pro):w.pro) : null)}</h3>`;
  let fb="";
  if(P.answered!==null){
    const ok=q.opts[P.answered]===w.pro;
    fb=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correcto.":"Mejor: «"+esc(w.pro)+"»."}</b> ${esc(w.why)} <span class="muted">También sirve: ${esc(w.alt)}${/[.?!]$/.test(w.alt)?"":"."}</span></div>
      <div class="row"><button class="btn primary" data-act="pNext">${P.i<P.qs.length-1?"Siguiente":"Ir a la simulación"}</button></div>`;
  }
  return `<button class="back" data-act="open" data-id="${s.id}">← ${esc(s.name)}</button>
    ${stepper("practice")}
    <div class="panel">
      <div class="qmeta"><span class="tag">${q.kind==="context"?"Sube el registro":"Completa la frase"}</span><span class="mono muted">${P.i+1} / ${P.qs.length}</span></div>
      <div class="dotsprog">${P.qs.map((_,k)=>`<i class="${k<P.i||(k===P.i&&P.answered!==null)?"done":""}"></i>`).join("")}</div>
      ${prompt}
      <div class="opts">${optsHTML}</div>
      ${fb}
    </div>`;
}

function startSim(){
  const s=scen();
  S.sim={i:0, results:[], answered:null, order: s.sim.map(t=>t.type==="free"?null:shuffle(t.opts.map((_,k)=>k)))};
  S.voiceMeta=null;
  if(!S.practice || S.practice.sid!==s.id) S.practiceDone = S.practiceDone && S.practiceDone.sid===s.id ? S.practiceDone : null;
  S.view="sim"; render();
}
const LEVEL={choice:"Nivel 1 · Elige la mejor respuesta", fill:"Nivel 2 · Completa la frase", free:"Nivel 3 · Responde con tus palabras"};
function vSim(){
  const s=scen(), M=S.sim, t=s.sim[M.i];
  let body="";
  if(t.type==="choice"||t.type==="fill"){
    const start = t.type==="fill" && atSentenceStart(t.tpl);
    const opts=M.order[M.i].map(k=>{
      const o=t.type==="choice"? t.opts[k].t : (start?cap(t.opts[k]):t.opts[k]);
      let cls="opt";
      if(M.answered!==null){ const good = t.type==="choice" ? t.opts[k].s>=1 : k===0; if(good) cls+=" ok"; else if(k===M.answered) cls+=" no"; }
      return `<button class="${cls}" data-act="sAnswer" data-k="${k}" ${M.answered!==null?"disabled":""}>${esc(o)}</button>`;}).join("");
    const tplHTML = t.type==="fill" ? `<p style="font-size:1.1rem">${fillHTML(t.tpl, M.answered!==null? (start?cap(t.opts[0]):t.opts[0]) : null)}</p>` : "";
    let fb="";
    if(M.answered!==null){
      const r=M.results[M.i];
      fb=`<div class="fb ${r.S>=1?"ok":r.S>=.4?"mid":"no"}"><b>${pct(r.S)} pts.</b> ${esc(r.fb)}</div>`;
    }
    body=`${tplHTML}<div class="opts">${opts}</div>${fb}`;
  } else {
    const r=M.answered!==null? M.results[M.i] : null;
    body = r ? freeFeedback(r) : `
      <p class="hint">Intenta usar: ${t.hint.map(h=>"<b>"+esc(h)+"</b>").join(", ")}.</p>
      <label for="answer" class="eyebrow">Tu respuesta (escribe o dicta)</label>
      <textarea id="answer" placeholder="Escribe aquí o toca el micrófono..."></textarea>
      <div class="row"><button class="icon-btn" id="micBtn" data-act="mic" aria-label="Dictar con el micrófono" aria-pressed="false">${ICON_MIC}</button>
        <button class="btn primary" data-act="sSubmit">Evaluar respuesta</button></div>
      <p class="note" id="micStatus"></p>`;
  }
  const next = M.answered!==null ? `<div class="row"><button class="btn primary" data-act="sNext">${M.i<s.sim.length-1?"Siguiente turno":"Ver resultados"}</button></div>` : "";
  return `<button class="back" data-act="open" data-id="${s.id}">← ${esc(s.name)}</button>
    ${stepper("sim")}
    <div class="panel">
      <div class="qmeta"><span class="tag">${LEVEL[t.type]}</span><span class="mono muted">Turno ${M.i+1} / ${s.sim.length}</span></div>
      <div class="dotsprog">${s.sim.map((_,k)=>`<i class="${k<M.i||(k===M.i&&M.answered!==null)?"done":""}"></i>`).join("")}</div>
      <div class="say"><div class="bubble"><div class="who">${esc(s.who)}</div>${esc(t.say)}</div>
        <button class="icon-btn" data-act="speak" aria-label="Escuchar en voz alta">${ICON_SPEAK}</button></div>
      ${body}${next}
    </div>`;
}
function freeFeedback(r){
  const chips=[...r.matched.map(m=>`<span class="chip ok">✓ ${esc(m)}</span>`), ...r.missing.map(m=>`<span class="chip no">falta: ${esc(m)}</span>`)].join("");
  const mulList=Object.entries(r.mul.found).map(([k,n])=>`«${esc(k)}»${n>1?" ×"+n:""}`).join(", ");
  return `<div class="fb ${r.S>=.75?"ok":r.S>=.45?"mid":"no"}"><b>${pct(r.S)} pts.</b> ${r.voice?"Evaluado por voz.":"Evaluado por texto (sin ritmo)."}</div>
    <p class="muted" style="font-size:.92rem">Dijiste: «${esc(r.text)}»</p>
    <div class="chips">${chips}</div>
    <div class="kpis">
      <div class="kpi"><b>${pct(r.v)}%</b><span>vocabulario objetivo</span></div>
      <div class="kpi"><b>${r.mul.count}</b><span>muletillas${mulList?": "+mulList:""}</span></div>
      <div class="kpi"><b>${r.ppm?Math.round(r.ppm):"—"}</b><span>palabras/min${r.ppm?"":" (solo voz)"}</span></div>
    </div>
    ${r.colloquial.length?`<p class="hint">Podrías cambiar ${r.colloquial.map(c=>"«"+esc(c.col)+"» por <b>"+esc(c.pro)+"</b>").join(", ")}.</p>`:""}
    ${r.notes.map(n=>`<p class="hint">${esc(n)}</p>`).join("")}
    <div class="fb mid"><b>Respuesta modelo:</b> ${esc(r.model)}</div>`;
}

function finishSim(){
  const s=scen(), M=S.sim;
  const before=scenarioProgress(progress,s);
  const simScore=Math.round(M.results.reduce((a,r)=>a+r.S,0)/M.results.length*100);
  const rec=progress.sims[s.id]||{best:0,attempts:0,last:0};
  rec.attempts++; rec.last=simScore; rec.best=Math.max(rec.best,simScore); progress.sims[s.id]=rec;
  // usar en la simulación libre una palabra objetivo también suma dominio
  M.results.filter(r=>r.type==="free").forEach(r=>{
    s.words.forEach(w=>{ if(hasStem(r.text, w.pro)) progress.words[w.id]=Math.min(3,(progress.words[w.id]||0)+1); });
  });
  save();
  const after=scenarioProgress(progress,s);
  const pr = S.practiceDone && S.practiceDone.sid===s.id ? S.practiceDone.correct : null;
  S.result={simScore, before, after, pr, results:M.results, isBest: simScore>=rec.best};
  S.view="results"; render();
  if(simScore>=75) setTimeout(fanfare, 250);
}
function recommendations(s, R){
  const out=[], free=R.results.filter(r=>r.type==="free");
  const mul=free.reduce((a,r)=>a+r.mul.count,0);
  const miss=[...new Set(free.flatMap(r=>r.missing))];
  const ppms=free.filter(r=>r.ppm).map(r=>r.ppm);
  const weakChoice=R.results.filter(r=>r.type!=="free" && r.S<1);
  if(miss.length) out.push(`Practica estas expresiones en voz alta: ${miss.map(m=>"«"+esc(m)+"»").join(", ")}.`);
  if(mul>=2) out.push(`Detectamos ${mul} muletillas. Cuando necesites pensar, haz una pausa breve en silencio: suena más seguro que «o sea» o «eh».`);
  if(ppms.length){ const avg=Math.round(ppms.reduce((a,b)=>a+b,0)/ppms.length);
    if(avg>PPM_RANGE[1]) out.push(`Hablaste a ${avg} palabras por minuto: un poco rápido. Apunta a ${PPM_RANGE[0]}–${PPM_RANGE[1]}.`);
    else if(avg<PPM_RANGE[0]) out.push(`Hablaste a ${avg} palabras por minuto: algo lento. Apunta a ${PPM_RANGE[0]}–${PPM_RANGE[1]}.`); }
  else out.push("Prueba la próxima vez respondiendo por voz para medir tu ritmo y tus muletillas al hablar.");
  if(weakChoice.length) out.push(`Revisa ${weakChoice.length>1?"los turnos":"el turno"} ${weakChoice.map(r=>r.turn+1).join(" y ")}: había una opción más adecuada para ${esc(s.short)}.`);
  if(s.id==="cita") out.push("En una cita, devolver la pregunta («¿y tú?») vale más que cualquier palabra elegante.");
  if(!out.length) out.push("Excelente. Repite la simulación por voz para consolidar.");
  return out;
}
function vResults(){
  const s=scen(), R=S.result;
  const total = R.pr!==null ? Math.round(0.4*R.pr*10 + 0.6*R.simScore) : R.simScore;
  const delta=R.after-R.before;
  const turns=R.results.map(r=>`<div class="turn"><span class="eyebrow">Turno ${r.turn+1} · ${r.type==="free"?"libre":r.type==="fill"?"completar":"elegir"}</span>
      <span>${esc(r.text)}</span>
      <span class="chips"><span class="chip ${r.S>=.75?"ok":r.S<.45?"no":""}">${pct(r.S)} pts</span>${r.type==="free"&&r.mul.count?`<span class="chip">${r.mul.count} muletilla${r.mul.count>1?"s":""}</span>`:""}${r.ppm?`<span class="chip mono">${Math.round(r.ppm)} ppm</span>`:""}</span></div>`).join("");
  return `<button class="back" data-act="open" data-id="${s.id}">← ${esc(s.name)}</button>
    <div class="stack" style="margin-top:12px">
      <div class="panel">
        <span class="eyebrow">Resultado · ${esc(s.name)}</span>
        <div class="score"><b class="mono">${total}</b><span class="muted">/ 100</span></div>
        <div class="kpis">
          <div class="kpi"><b>${R.pr!==null?R.pr+"/10":"—"}</b><span>práctica</span></div>
          <div class="kpi"><b>${R.simScore}</b><span>simulación</span></div>
          <div class="kpi"><b>${(progress.sims[s.id]||{}).best||0}</b><span>mejor simulación</span></div>
        </div>
        <div class="barlabel"><span>Dominio del escenario</span><span class="mono">${R.after}%${delta>0?` <span class="delta">+${delta}</span>`:""}</span></div>
        <div class="bar"><i id="newBar" data-w="${R.after}" style="width:${R.before}%"></i></div>
        ${R.pr===null?`<p class="note">El puntaje total combina práctica (40%) y simulación (60%). Hiciste solo la simulación.</p>`:`<p class="note">Total = 40% práctica + 60% simulación.</p>`}
      </div>
      <div class="panel"><h3>Qué mejorar</h3><ul class="recs">${recommendations(s,R).map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="panel"><h3>Detalle por turno</h3>${turns}</div>
      <div class="row"><button class="btn primary" data-act="startSim">Repetir simulación</button><button class="btn" data-act="startPractice">Practicar vocabulario</button><button class="btn ghost" data-act="home">Otros escenarios</button></div>
    </div>`;
}

/* ===================== EVENTOS ===================== */
app.addEventListener("click", onAct);
document.querySelector(".top").addEventListener("click", onAct);
function onAct(e){
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="home"){ S={view:"home"}; render(); }
  else if(a==="open"){ S.sid=el.dataset.id||S.sid; S.view="scenario"; render(); }
  else if(a==="reset"){ S.confirmReset=true; render(); }
  else if(a==="resetNo"){ S.confirmReset=false; render(); }
  else if(a==="resetYes"){ progress=emptyProgress(); save(); S={view:"home"}; render(); }
  else if(a==="startPractice"){ if(el.dataset.id) S.sid=el.dataset.id; startPractice(); }
  else if(a==="startSim"){ if(el.dataset.id) S.sid=el.dataset.id; startSim(); }
  else if(a==="pAnswer"){
    const P=S.practice, q=P.qs[P.i], k=+el.dataset.k; P.answered=k;
    const ok=q.opts[k]===q.w.pro, cur=progress.words[q.w.id]||0;
    progress.words[q.w.id]= ok? Math.min(3,cur+1) : Math.max(0,cur-1);
    if(ok){ P.correct++; chime(); } save(); render();
  }
  else if(a==="pNext"){
    const P=S.practice;
    if(P.i<P.qs.length-1){ P.i++; P.answered=null; render(); }
    else { S.practiceDone={sid:S.sid, correct:P.correct}; startSim(); }
  }
  else if(a==="sound"){ SOUND_ON=!SOUND_ON; try{ localStorage.setItem("aura.sound", SOUND_ON?"on":"off"); }catch(err){} paintSoundBtn(); if(SOUND_ON) chime(); }
  else if(a==="speak"){ const s=scen(); speak(s.sim[S.sim.i].say); }
  else if(a==="mic"){ toggleMic(); }
  else if(a==="sAnswer"){
    const s=scen(), M=S.sim, t=s.sim[M.i], k=+el.dataset.k; M.answered=k;
    M.results[M.i] = t.type==="choice"
      ? {type:"choice", turn:M.i, S:t.opts[k].s, fb:t.opts[k].fb, text:t.opts[k].t}
      : {type:"fill", turn:M.i, S:k===0?1:0, fb:(k===0?"Correcto. ":"Lo adecuado era «"+t.opts[0]+"». ")+t.fb, text:t.tpl.replace("___", atSentenceStart(t.tpl)?cap(t.opts[k]):t.opts[k])};
    if(M.results[M.i].S>=1) chime();
    render();
  }
  else if(a==="sSubmit"){
    const s=scen(), M=S.sim, t=s.sim[M.i], ta=document.getElementById("answer"), text=(ta.value||"").trim();
    if(rec){ try{rec.stop();}catch(err){} }
    if(!text){ document.getElementById("micStatus").textContent="Escribe o dicta una respuesta antes de evaluar."; return; }
    const r=scoreFree(t, text, S.voiceMeta, s.weights, s);
    M.results[M.i]=Object.assign(r,{type:"free", turn:M.i, text, model:t.model}); M.answered=0; S.voiceMeta=null;
    if(r.S>=.75) chime();
    render();
  }
  else if(a==="sNext"){
    const s=scen(), M=S.sim;
    if(M.i<s.sim.length-1){ M.i++; M.answered=null; S.voiceMeta=null; render(); } else finishSim();
  }
}
try{ if("speechSynthesis" in window) speechSynthesis.getVoices(); }catch(e){}
paintSoundBtn();
render();
</script>

</body>
